<h2 style="font-size:18px;margin:0 0 20px">用户靓号列表</h2>
<section class="panel filters">
<div class="field"><label>靓号号码</label><input id="qNumber" placeholder="请输入完整号码"></div>
<div class="field"><label>靓号等级</label><select id="qLevel"><option value="">全部</option><option>SS3</option><option>SS2</option><option>SS1</option><option>S3</option><option>S2</option><option>S1</option><option>A</option><option>B</option><option>C</option></select></div><div class="field"><label>用户 UID</label><input id="qUid" placeholder="请输入用户 UID"></div><div class="field"><label>获取方式</label><select id="qSource"><option value="">全部</option><option>人工分配</option><option>商城购买</option></select></div><button class="primary" onclick="filterRows()">查询</button><button onclick="resetFilters()">重置</button></section><section class="panel tablepanel"><div class="toolbar"><button class="primary" onclick="openAssignModal()">＋ 人工分配</button></div><div class="tablewrap"><table><thead><tr><th>靓号号码</th><th>靓号等级</th><th>用户 UID</th><th>获取方式</th><th>绑定时间</th><th>到期时间</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="pager"><span id="pageInfo">共 8 条</span><select onchange="poolSize=+this.value;poolPage=1;render()"><option value="10">10条/页</option><option value="20">20条/页</option><option value="50">50条/页</option></select><button onclick="poolPage=Math.max(1,poolPage-1);render()">‹</button><button onclick="poolPage++;render()">›</button></div>
</section>

</div></main></div>
