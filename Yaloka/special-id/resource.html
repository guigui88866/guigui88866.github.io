<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yaloka 后台管理系统 - 靓号资源</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",Arial,sans-serif;font-size:12px;color:#303133;background:#f2f3f5}.topbar{height:6px;background:#2b1c29}.app{display:flex;min-height:100vh}aside{width:162px;background:#001529;color:#fff;flex-shrink:0}.brand{height:60px;display:flex;align-items:center;justify-content:center;font-weight:600;border-bottom:1px solid #193047;font-size:13px}.navsearch{margin:12px 10px;padding:8px;border:1px solid #456070;border-radius:3px;color:#b8c7d2}.navtitle{padding:12px 20px;color:#c6d4df}.navitem{padding:13px 28px;color:#d7e2eb}.navitem.active{background:#409eff;color:#fff}main{flex:1;min-width:0}.crumb{height:44px;background:#fff;border-bottom:1px solid #e7e9ed;padding:15px 18px;color:#7b8794}.crumb b{color:#409eff;font-weight:500}.content{padding:8px}.panel{background:#fff;border:1px solid #e4e7ed;border-radius:4px;margin-bottom:8px;padding:14px 10px;box-shadow:0 1px 2px #00000008}.filters{display:flex;align-items:center;gap:10px;min-height:64px}.filters label{margin-right:2px}.input,.select{height:32px;border:1px solid #dcdfe6;border-radius:3px;padding:0 10px;background:#fff;color:#606266;outline:none}.input:focus,.select:focus{border-color:#409eff}.filters .input{width:180px}.btn{border:1px solid #dcdfe6;background:#fff;color:#606266;border-radius:3px;height:32px;padding:0 13px;cursor:pointer}.btn.primary{background:#409eff;border-color:#409eff;color:#fff}.btn.success{background:#67c23a;border-color:#67c23a;color:#fff}.btn.danger{color:#f56c6c;border-color:#fbc4c4}.btn.small{height:27px;padding:0 9px;font-size:12px}.tablepanel{padding:14px 10px 8px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:820px;text-align:center}thead{background:#f5f7fa}th{height:38px;font-weight:600;color:#303133;border:1px solid #ebeef5}td{height:58px;border:1px solid #ebeef5;padding:6px 10px}tbody tr:hover{background:#f5f7fa}.leveltag{display:inline-block;padding:3px 9px;border-radius:3px;background:#ecf5ff;color:#409eff;font-weight:600}.thumb{width:112px;height:38px;object-fit:contain;display:block;margin:auto}.price{font-variant-numeric:tabular-nums}.link{border:0;background:none;cursor:pointer;padding:0 4px;font-size:12px}.link.edit{color:#67c23a}.link.delete{color:#f56c6c}.pager{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:14px 5px 2px;color:#606266}.pager select{height:27px;border:1px solid #dcdfe6;border-radius:3px;color:#606266}.page{border:1px solid #dcdfe6;border-radius:3px;padding:4px 8px}.page.active{background:#409eff;color:#fff;border-color:#409eff}.muted{color:#909399}.overlay{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:20px;z-index:5}.overlay.show{display:flex}.modal{width:520px;max-width:100%;background:#fff;border-radius:4px;box-shadow:0 8px 28px #0003}.modalhead{height:50px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ebeef5;font-size:14px}.close{border:0;background:none;font-size:19px;color:#909399;cursor:pointer}.modalbody{padding:22px 28px}.formrow{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:start;margin-bottom:17px}.formrow>label{text-align:right;padding-top:8px;color:#606266}.required:before{content:"* ";color:#f56c6c}.formrow .input,.formrow .select{width:100%;height:34px}.preview{border:1px solid #dcdfe6;border-radius:4px;width:150px;height:74px;display:flex;align-items:center;justify-content:center;background:#fff}.preview img{width:138px;height:48px;object-fit:contain}.hint{font-size:11px;color:#909399;margin-top:6px}.upload{width:105px;height:100px;border:1px dashed #dcdfe6;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#909399;cursor:pointer;background:#fafafa}.upload strong{font-size:25px;font-weight:300}.modalfoot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 20px}.modalfoot .btn{min-width:58px}.error{color:#f56c6c;margin:-8px 0 12px 104px;display:none}.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);background:#303133;color:#fff;padding:10px 18px;border-radius:4px;display:none;z-index:9}.toast.show{display:block}@media(max-width:800px){aside{width:125px}.brand{font-size:11px}.content{padding:5px}.filters{flex-wrap:wrap}.filters .input{width:150px}}
</style><style>aside,.topbar,.crumb{display:none!important}.app{min-height:100vh}.durationOptions{display:flex;gap:10px;flex-wrap:wrap;padding-top:8px}.modal{max-height:95vh;overflow:auto}</style><script src="seed.js"></script><script src="engine.js"></script></head><body><div class="topbar"></div><div class="app">
<aside><div class="brand">Yaloka后台管理系统</div><div class="navsearch">⌕　靓号</div><div class="navtitle">用户管理　⌃</div><div class="navitem">靓号分配</div><div class="navitem active">靓号资源</div><div class="navtitle">商城管理　⌄</div><div class="navitem">商城列表</div><div class="navitem">购买记录</div></aside>
<main><div class="crumb">用户管理　/　<b>靓号资源</b></div><div class="content">
<section class="panel filters"><label>等级</label><select class="select" id="qLevel"><option value="">全部等级</option><option>SS3</option><option>SS2</option><option>SS1</option><option>S3</option><option>S2</option><option>S1</option><option>A</option><option>B</option><option>C</option></select><button class="btn primary" onclick="render()">⌕ 搜索</button><button class="btn success" onclick="resetFilter()">⟳ 重置</button></section>
<section class="panel tablepanel"><div class="toolbar"><button class="btn primary" onclick="openAdd()">＋ 新增</button></div>
<div class="tablewrap"><table><thead><tr><th>等级</th><th>靓号图</th><th>金币单价／天</th><th>可购买时长</th><th>创建时间</th><th>修改时间</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></div>
<div class="pager"><span id="count"></span></div></section>
</div></main></div>
<div class="overlay" id="overlay"><div class="modal"><div class="modalhead"><span id="modalTitle">新增等级</span><button class="close" onclick="closeModal()">×</button></div><div class="modalbody">
<div class="formrow"><label class="required">等级</label><select class="select" id="level"><option value="">请选择等级</option><option>SS3</option><option>SS2</option><option>SS1</option><option>S3</option><option>S2</option><option>S1</option><option>A</option><option>B</option><option>C</option></select></div>
<div class="formrow"><label class="required">金币单价／天</label><input class="input" id="price" type="number" min="1" step="1" placeholder="请输入正整数"></div>
<div class="formrow"><label class="required">可购买时长</label><div class="durationOptions" id="durationChecks"></div></div><div class="formrow"><label class="required">靓号图</label><div><div class="preview" id="preview"><span class="muted">请选择等级</span></div><div class="hint">上传靓号资源图片，编辑时可替换</div><input type="file" id="imageFile" accept="image/*" style="display:none" onchange="uploadImage(this)"><button class="btn primary small" style="margin-top:8px" onclick="document.getElementById('imageFile').click()">上传／替换图片</button></div></div>
<div class="error" id="error"></div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="save()">确定</button></div></div></div><div class="toast" id="toast"></div>
<script>
const levels=['SS3','SS2','SS1','S3','S2','S1','A','B','C'];let rows=[],editLevel=null,pendingImage='';
function render(){rows=SpecialDemo.read().resources;const q=document.getElementById('qLevel').value,arr=rows.filter(r=>!q||r.level===q);document.getElementById('tbody').innerHTML=arr.map(r=>`<tr><td><span class="leveltag">${r.level}</span></td><td><img class="thumb" src="${r.image}" alt="${r.level}"></td><td>${r.price.toLocaleString('en-US')}</td><td>${r.durations.join('、')} 天</td><td>${r.created}</td><td>${r.updated}</td><td><button class="link edit" onclick="openEdit('${r.level}')">编辑</button></td></tr>`).join('')||'<tr><td colspan="7">暂无数据</td></tr>';document.getElementById('count').textContent='共 '+arr.length+' 条'}
function resetFilter(){document.getElementById('qLevel').value='';render()}
function formSetup(r){pendingImage=r?.image||'';document.getElementById('modalTitle').textContent=editLevel?'编辑':'新增';const select=document.getElementById('level');select.innerHTML='<option value="">请选择等级</option>'+levels.map(l=>`<option value="${l}" ${r?.level===l?'selected':''} ${!editLevel&&rows.some(x=>x.level===l)?'disabled':''}>${l}${!editLevel&&rows.some(x=>x.level===l)?'（已配置）':''}</option>`).join('');select.disabled=!!editLevel;document.getElementById('price').value=r?.price||'';document.getElementById('durationChecks').innerHTML=[15,30,90,180].map(day=>`<label><input type="checkbox" value="${day}" ${r?.durations.includes(day)?'checked':''}>${day}天</label>`).join('');document.getElementById('imageFile').value='';document.getElementById('error').style.display='none';showPreview();document.getElementById('overlay').classList.add('show')}
function openAdd(){editLevel=null;formSetup(null)}function openEdit(l){editLevel=l;formSetup(rows.find(x=>x.level===l))}
function showPreview(){document.getElementById('preview').innerHTML=pendingImage?`<img src="${pendingImage}" alt="靓号图预览">`:'<span class="muted">请上传靓号图</span>'}
function uploadImage(input){const f=input.files[0];if(!f)return;if(!f.type.startsWith('image/')){showToast('请选择图片文件');return}if(f.size>2*1024*1024){showToast('演示图片请小于 2 MB');return}const reader=new FileReader();reader.onload=()=>{pendingImage=reader.result;showPreview()};reader.readAsDataURL(f)}
function save(){const record={level:document.getElementById('level').value,price:Number(document.getElementById('price').value),durations:[...document.querySelectorAll('#durationChecks input:checked')].map(e=>+e.value),image:pendingImage};try{SpecialDemo.saveResource(record,editLevel);closeModal();render();showToast('保存成功（模拟）')}catch(e){const err=document.getElementById('error');err.textContent=e.message;err.style.display='block'}}
function removeLevel(level){const box=document.createElement('div');box.className='overlay show';box.id='deleteOverlay';box.innerHTML=`<div class="modal"><div class="modalhead">提示</div><div class="modalbody">确认删除 ${level} 等级配置？号码池与历史订单会保留。<div id="deleteError" style="color:#f56c6c;margin-top:12px"></div></div><div class="modalfoot"><button class="btn" id="cancelDelete">取消</button><button class="btn primary" id="confirmDelete">确定</button></div></div>`;document.body.append(box);document.getElementById('cancelDelete').onclick=()=>box.remove();document.getElementById('confirmDelete').onclick=()=>{try{SpecialDemo.deleteResource(level);box.remove();render();showToast('已删除等级配置')}catch(e){document.getElementById('deleteError').textContent=e.message}}}
function closeModal(){document.getElementById('overlay').classList.remove('show')}
function showToast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
window.addEventListener('storage',()=>{if(!document.getElementById('overlay').classList.contains('show'))render()});render();
</script></body></html>
