<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yaloka 后台 - 购买记录</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f3f5;color:#303133;font:13px/1.5 Arial,"Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #dcdfe6;background:#fff;border-radius:3px;padding:7px 13px;color:#606266}.primary{background:#409eff;border-color:#409eff;color:#fff}.content{padding:12px}.panel{background:#fff;border:1px solid #e4e7ed;border-radius:5px;padding:15px;margin-bottom:10px}.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.field{display:flex;align-items:center;gap:7px}.field input,.field select{height:32px;border:1px solid #dcdfe6;border-radius:3px;padding:0 9px;min-width:145px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:center}th{background:#f5f7fa;height:38px;border:1px solid #ebeef5}td{height:46px;border:1px solid #ebeef5;padding:7px 10px}.tag{display:inline-block;padding:3px 8px;border-radius:3px;background:#ecf5ff;color:#337ecc}.empty{text-align:center;color:#909399;padding:35px}.pager{text-align:right;padding:14px 0 2px;color:#606266}
</style><script src="seed.js"></script><script src="engine.js"></script></head><body><div class="content">
<section class="panel filters"><div class="field"><label>用户 UID</label><input id="uid" placeholder="请输入用户 UID"></div><div class="field"><label>订单类型</label><select id="type"><option value="">全部</option><option value="SpecialID">Special ID</option><option value="effect">装扮</option></select></div><div class="field"><label>订单状态</label><select id="status"><option value="">全部</option><option value="completed">已完成</option></select></div><button class="primary" onclick="render()">搜索</button><button onclick="resetFilters()">重置</button></section>
<section class="panel"><div class="tablewrap"><table><thead><tr><th>订单编号</th><th>用户 UID</th><th>订单类型</th><th>特效 ID</th><th>特效名称</th><th>金币单价／天</th><th>购买天数</th><th>实际消耗金币</th><th>购买时间</th><th>订单状态</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="pager" id="count"></div></section>
</div><script>
function getOrders(){const v=SpecialDemo.read(),sid=(v.orders||[]).map(o=>({...o,orderType:"SpecialID"})),effects=(v.ordinary?.orders||[]).map(o=>({...o,orderType:"effect"}));return [...sid,...effects].sort((a,b)=>new Date(b.created)-new Date(a.created))}
function render(){const uid=document.getElementById("uid").value.trim(),type=document.getElementById("type").value,status=document.getElementById("status").value;const list=getOrders().filter(o=>(!uid||String(o.userId).includes(uid))&&(!type||o.orderType===type)&&(!status||o.status===status));document.getElementById("tbody").innerHTML=list.map(o=>'<tr><td>'+o.id+'</td><td>'+o.userId+'</td><td><span class="tag">'+(o.orderType==="SpecialID"?"Special ID":"装扮")+'</span></td><td>'+(o.orderType==="SpecialID"?"--":(o.effect||"--"))+'</td><td>'+(o.name||"--")+'</td><td>'+Number(o.dailyPrice||0).toLocaleString("en-US")+'</td><td>'+(o.days||"--")+'</td><td>'+Number(o.price||0).toLocaleString("en-US")+'</td><td>'+(o.created||"--")+'</td><td>'+(o.status==="completed"?"已完成":o.status||"--")+'</td></tr>').join("")||'<tr><td colspan="10" class="empty">暂无符合条件的订单</td></tr>';document.getElementById("count").textContent="共 "+list.length+" 条记录"}
function resetFilters(){["uid","type","status"].forEach(id=>document.getElementById(id).value="");render()}
window.addEventListener("storage",render);render();
</script></body></html>
