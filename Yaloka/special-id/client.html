.grade-heading strong{font-size:16px!important;font-weight:750;color:#483453;letter-spacing:.1px}
.grade-heading button{border:1px solid #e4d2f2!important;background:#fff!important;border-radius:18px!important;padding:6px 12px!important;box-shadow:0 2px 6px #7e55a10d}
.grade-showcase{margin-top:0!important;gap:10px!important;row-gap:13px!important}


.empty-state{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:210px;padding:24px 12px;color:#9a91a4;text-align:center}
.empty-state-illustration{width:92px;height:76px;display:block}
.empty-state-label{font-size:14px;font-weight:600;letter-spacing:.1px;color:#9a91a4}

/* V10: single-level filtering only; keep custom entry and grade selector fixed above the scrollable inventory */
#scrollArea.id-content{display:flex!important;flex-direction:column!important;overflow:hidden!important;min-height:0;padding:5px 18px 0!important;gap:0}
#scrollArea.id-content>.own,#scrollArea.id-content>.custom-top,#scrollArea.id-content>.id-filter-wrap{flex:0 0 auto}
#scrollArea.id-content>.custom-top{margin:0 0 10px!important}
#scrollArea.id-content>.id-filter-wrap{padding:0 0 10px!important;margin:0!important;border:0!important;background:#fff!important}
#scrollArea.id-content .pattern-row,#scrollArea.id-content .format-label{display:none!important}
#scrollArea.id-content .grade-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:2px 0 0}
#scrollArea.id-content .grade-row button{min-width:0;padding:9px 2px;font-size:12px}
#scrollArea.id-content>.id-items{flex:1 1 auto;min-height:0;overflow-y:auto!important;overscroll-behavior:contain;align-content:start;padding:0 0 14px!important;margin:0!important}

function idCard(n){const level=levelOf(n);return `<div class="item id-card ${selected['Unique ID']===n?'selected':''}" data-id="${n}"><div class="id-medal-art"><img src="${bannerOf(n)}" alt="${level} Special ID badge"><b>${n}</b></div><div class="id-level-name">${level} ${n}</div><div class="price"><span class="coin">◆</span>${fmt(price(level,1))} <small>/ day</small></div></div>`}
function idMallFilters(){return `<div class="id-filter-wrap"><div class="grade-row">${SpecialDemo.read().resources.map(r=>r.level).map(g=>`<button class="${minor===g?'active':''}" data-grade="${g}">${g}</button>`).join('')}</div></div>`}
function listHTML(){if(tab!=='Unique ID')return `<div class="items">${(products[tab]||[]).map(p=>`<div class="item ${selected[tab]===p.id?'selected':''}" data-item="${p.id}"><button class="play" data-preview="${p.id}">▶</button><div class="art">${p.icon}</div><div class="name">${p.name}</div><div class="price"><span class="coin">◆</span>${fmt(p.unit)} / day</div></div>`).join('')}</div>`;const filtered=SpecialDemo.read().pool.filter(r=>r.mall==='listed'&&r.use==='free'&&r.level===minor&&!!config(r.level)).map(r=>r.id);return `${ownHTML()}<button type="button" class="custom-top" data-custom><span>✦ Customize Special ID</span><span>›</span></button>${idMallFilters()}<div class="items id-items">${filtered.map(idCard).join('')||`<div class="empty-state"><svg class="empty-state-illustration" viewBox="0 0 100 82" aria-hidden="true"><ellipse cx="50" cy="72" rx="34" ry="5" fill="#eee9f2"/><path d="M20 24 50 10l30 14-30 15Z" fill="#eee7f7" stroke="#d9cde7" stroke-width="1.5"/><path d="M20 24v31l30 15V39Z" fill="#f7f3fb" stroke="#d9cde7" stroke-width="1.5"/><path d="M80 24v31L50 70V39Z" fill="#e9e0f3" stroke="#d9cde7" stroke-width="1.5"/><path d="M35 19l30 14M35 19l-8 4M35 19l-2 8" fill="none" stroke="#c8b8db" stroke-width="2" stroke-linecap="round"/><circle cx="72" cy="17" r="10" fill="#fff" stroke="#c9b8dc" stroke-width="2"/><path d="m79 24 7 7" stroke="#c9b8dc" stroke-width="3" stroke-linecap="round"/><path d="M68 17h8M72 13v8" stroke="#d8cce6" stroke-width="1.5" stroke-linecap="round"/></svg><div class="empty-state-label">No data</div></div>`}</div>`}
function gradeDescriptionHTML(){const grades=['SS3','SS2','SS1','S3','S2','S1','A','B','C'];return `<div class="grade-description"><div class="grade-heading"><strong>Special ID Levels</strong><button type="button" data-rules>Rules ›</button></div><div class="grade-showcase">${grades.map((g,i)=>`<div class="grade-example"><img src="${gradeArt[i]}" alt="${g} level artwork"><b>123456</b></div>`).join('')}</div></div>`}
function customHTML(){return `${ownHTML()}<div class="custom-form"><div class="custom-input-wrap"><input id="idInput" class="${searchError?'invalid':''}" inputmode="numeric" maxlength="6" value="${esc(term)}" placeholder="Enter a Special ID to check availability."><div class="search-error" ${searchError?'':'hidden'}>${esc(searchError)}</div></div><button class="primary" data-search>Search</button></div>${searchResult?`<div class="result-label">Search Result</div><div class="custom-result">${idCard(searchResult)}</div>`:''}${gradeDescriptionHTML()}`}
function sheetHTML(){if(!modal)return '';if(modal.type==='rules')return `<div class="overlay dialogWrap" data-rules-overlay><div class="dialog rules-dialog"><div class="rules-head"><h2>Rules</h2><button type="button" class="rules-close" data-close-rules aria-label="Close">×</button></div><ol class="rules-list"><li>Only one Special ID can be active at a time.</li><li>Choose an available number from the store or search for an exact number.</li><li>Available durations depend on the level configuration. Total = daily price × days.</li><li>A new number replaces your current Special ID immediately. Remaining validity is lost, without refund, compensation or transfer.</li><li>Renewal adds days to the current expiry date.</li><li>You receive an in-app reminder 3 days before expiry and a notice at expiry. An expired number is released for purchase again.</li></ol></div></div>`;if(modal.type==='buy'){let p=modal.p,l=modal.level,id=modal.number,d=modal.days,total=id?price(l,d):p.unit*d;let idNotice=id?(own()?.number===id?'Renew your current Special ID. The new duration will be added to the existing expiry date.':''):'Select a duration to purchase this effect.';return `<div class="overlay" data-overlay><div class="sheet"><div class="handle"></div><div class="product-static">${id?`<div class="id-medal-art drawer-id-art"><img src="${bannerOf(id)}" alt="Special ID badge"><b>${esc(id)}</b></div><strong class="id-drawer-title">${subOf(id)} ${esc(id)}</strong>`:`<div class="art">${p.icon}</div><strong>${p.name}</strong>`}</div>${idNotice?`<div class="notice">${idNotice}</div>`:''}<div class="duration">${(id?(config(l)?.durations||[]):p.durations).map(n=>`<button class="${d===n?'chosen':''}" data-days="${n}"><strong>${n} Days</strong><span><span class="coin">◆</span>${fmt(id?price(l,n):p.unit*n)}</span></button>`).join('')}</div><div class="sheet-foot">${wallet()}<button class="primary" data-confirm>Purchase</button></div></div></div>`}if(modal.type==='replace'){return `<div class="overlay dialogWrap"><div class="dialog"><h2>Replace Current Special ID?</h2><p>Your current Special ID <strong>${own()?.number||'—'}</strong> has <strong>${left()} days</strong> remaining.<br>Purchasing <strong>${modal.number}</strong> will replace it immediately. The remaining validity will be lost, without refund, compensation or transfer.</p><div class="actions"><button data-cancel-replace>Cancel</button><button class="primary" data-do-replace>Confirm</button></div></div></div>`}if(modal.type==='success'){return `<div class="overlay dialogWrap"><div class="dialog"><h2>Purchase successful!</h2>${modal.number?`<div class="success-number">${esc(modal.level||levelOf(modal.number)||'')} ${modal.number}</div><p>Your Special ID is now active.</p>`:`<div class="success-art">${modal.icon}</div><p>${modal.name} added to your decorations.</p>`}<div class="actions"><button data-done>Done</button>${modal.number?'':`<button class="primary" data-mine>Go equip</button>`}</div></div></div>`}if(modal.type==='topup')return `<div class="overlay" data-overlay><div class="sheet topup-sheet"><div class="handle"></div><h2>Recharge</h2><p class="hint">Demo recharge · No real payment</p><div class="sheet-foot">${wallet()}<button class="primary" data-topup>+ 1,000,000 Coins</button></div></div></div>`;if(modal.type==='preview')return `<div class="overlay" data-preview-dismiss style="align-items:center"><div class="preview-stage"><div class="art">${modal.icon}</div><p>${modal.name}</p></div></div>`;return ''}
function render(){const custom=page==='custom';$('#phone').innerHTML=`<div class="status"><span>12:00</span><span>▮▮▮　◉　▰</span></div><div class="head"><button class="back" data-back>‹</button><h1>${custom?'Customize Special ID':page==='mine'?'Mine':'Store'}</h1>${custom||page==='mine'?'<span style="min-width:46px"></span>':'<button class="mine-button" data-mine>Mine</button>'}</div>${page==='store'?`<div class="tabs">${[...Object.keys(products),'Unique ID'].map(t=>`<button data-tab="${t}" class="${tab===t?'active':''}">${t==='Unique ID'?'Special ID':t}</button>`).join('')}</div>`:''}<div class="content ${tab==='Unique ID'?'id-content':''}" id="scrollArea">${page==='store'?listHTML():custom?customHTML():'<div class="empty">Existing Mine page (demo placeholder)</div>'}</div>${page!=='mine'?`<div class="wallet-bar">${wallet()}<button class="primary" data-purchase ${!selected[tab]?'disabled':''}>Purchase</button></div>`:''}<div class="indicator"></div>${sheetHTML()}<div id="toast"></div>`;bind()}
function showToast(t){const el=$('#toast');if(!el)return;el.className='toast';el.textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{if(el){el.className='';el.textContent=''}},2800)}
function openBuyItem(p){selected[tab]=p.id;modal={type:'buy',p,days:3};render()}
function openBuyID(n){if(!purchasable(n)){showToast('This Special ID is unavailable.');return}const level=own()?.number===n?own().level:levelOf(n);if(!level){showToast('No matching Special ID found.');return}selected['Unique ID']=n;modal={type:'buy',number:n,level,days:30};render()}
function confirmBuy(){if(modal?.type!=='buy')return;const snapshot={...modal};if(snapshot.number){if(!purchasable(snapshot.number)){modal=null;render();showToast('This Special ID is unavailable.');return}const currentId=own();if(currentId&&currentId.number!==snapshot.number){modal={...snapshot,type:'replace'};render();return}}finishBuy(snapshot)}
function finishBuy(snap){const total=snap.number?price(snap.level,snap.days):snap.p.unit*snap.days;if(data.balance<total){modal={type:'topup',previous:snap};render();showToast('Not enough coins. Top up first.');return}data.balance-=total;if(snap.number){const previous=own();const renew=previous?.number===snap.number;data.id={number:snap.number,level:snap.level,expires:(renew?previous.expires:Date.now())+snap.days*864e5,source:renew?previous.source:'商城购买'};data.purchases.push({number:snap.number,days:snap.days,total,action:renew?'Renew':previous?'Replace':'Purchase'});modal={type:'success',number:snap.number}}else{data.purchases.push({effect:snap.p.id,days:snap.days,total});modal={type:'success',name:snap.p.name,icon:snap.p.icon}}save();render()}
function runSearch(){const v=($('#idInput')?.value||'').trim();term=v;searchResult=null;searchError='';selected['Unique ID']=null;if(!/^\d{6}$/.test(v)){searchError='Enter a 6-digit Special ID.';render();return}if(!levelOf(v)){searchError='No matching Special ID found.';render();return}if(data.taken.includes(v)||own()?.number===v){searchError='This Special ID is already taken.';render();return}if(!purchasable(v)){searchError='This Special ID is unavailable.';render();return}searchResult=v;selected['Unique ID']=v;render()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{const next=b.dataset.tab;if(next==='Unique ID'){minor='SS3';selected['Unique ID']=null;}tab=next;render()});document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{minor=b.dataset.grade;selected['Unique ID']=null;render()});document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>openBuyItem(products[tab].find(p=>p.id===b.dataset.item)));document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openBuyID(b.dataset.id));document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=e=>{e.stopPropagation();const p=products[tab].find(x=>x.id===b.dataset.preview);modal={type:'preview',name:p.name,icon:p.icon};render();clearTimeout(previewTimer);previewTimer=setTimeout(()=>{if(modal?.type==='preview'){modal=null;render()}},2100)});$('[data-preview-dismiss]')?.addEventListener('click',()=>{clearTimeout(previewTimer);modal=null;render()});$('[data-custom]')?.addEventListener('click',()=>{page='custom';tab='Unique ID';searchResult=null;searchError='';term='';selected['Unique ID']=null;render()});$('[data-back]')?.addEventListener('click',()=>{if(page==='custom'){page='store';searchResult=null;searchError='';term='';selected['Unique ID']=null}else if(page==='mine')page='store';else{tab='Avatar Frame';selected={'Avatar Frame':null,'Ride':null,'Unique ID':null}}render()});$('[data-renew]')?.addEventListener('click',()=>openBuyID(own().number));$('[data-search]')?.addEventListener('click',runSearch);$('[data-rules]')?.addEventListener('click',()=>{modal={type:'rules'};render()});$('[data-close-rules]')?.addEventListener('click',()=>{modal=null;render()});$('[data-rules-overlay]')?.addEventListener('click',e=>{if(e.target.dataset.rulesOverlay!==undefined){modal=null;render()}});$('#idInput')?.addEventListener('input',()=>{const input=$('#idInput');if(searchError){searchError='';input?.classList.remove('invalid');const err=document.querySelector('.search-error');if(err){err.textContent='';err.hidden=true}}if(searchResult&&input?.value.trim()!==searchResult){searchResult=null;selected['Unique ID']=null;document.querySelector('.result-label')?.remove();document.querySelector('.custom-result')?.remove()}});$('#idInput')?.addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});$('[data-purchase]')?.addEventListener('click',()=>{let id=selected[tab];if(tab==='Unique ID')openBuyID(id);else openBuyItem(products[tab].find(p=>p.id===id))});document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{modal.days=+b.dataset.days;render()});$('[data-confirm]')?.addEventListener('click',confirmBuy);$('[data-cancel-replace]')?.addEventListener('click',()=>{modal={...modal,type:'buy'};render()});$('[data-do-replace]')?.addEventListener('click',()=>finishBuy({...modal,type:'buy'}));$('[data-done]')?.addEventListener('click',()=>{modal=null;render()});document.querySelectorAll('[data-mine]').forEach(b=>b.onclick=()=>{modal=null;page='mine';render()});document.querySelectorAll('[data-wallet]').forEach(b=>b.onclick=()=>{const previous=modal?.type==='buy'?{...modal}:modal?.type==='topup'?modal.previous:null;modal={type:'topup',previous};render()});$('[data-topup]')?.addEventListener('click',()=>{data.balance+=1000000;save();modal=modal.previous||null;render();showToast('Demo recharge successful.');});$('[data-overlay]')?.addEventListener('click',e=>{if(e.target.dataset.overlay!==undefined){modal=modal?.type==='topup'?modal.previous||null:null;render()}})}
</script><script src="client-v2.js"></script></body></html>
