<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yaloka 后台 - 号码管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f3f5;color:#303133;font:13px/1.5 Arial,"Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #dcdfe6;background:#fff;border-radius:3px;padding:7px 13px;color:#606266}.primary{background:#409eff;border-color:#409eff;color:#fff}.success{background:#67c23a;border-color:#67c23a;color:#fff}.danger{color:#f56c6c;border-color:#fbc4c4}.content{padding:12px}.overview{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:10px}.metric,.panel{background:#fff;border:1px solid #e4e7ed;border-radius:5px;padding:14px;box-shadow:0 1px 2px #00000008}.metric-label{color:#606266;font-size:12px}.metric-value{font-size:23px;font-weight:600;margin-top:6px}.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.field{display:flex;align-items:center;gap:7px}.field input,.field select{height:32px;border:1px solid #dcdfe6;border-radius:3px;padding:0 9px;min-width:145px}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.batch{display:none;background:#ecf5ff;color:#337ecc;padding:9px;margin-bottom:12px;gap:8px;align-items:center}.batch.show{display:flex}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:center}th{background:#f5f7fa;height:38px;border:1px solid #ebeef5}td{height:46px;border:1px solid #ebeef5;padding:7px 10px}.tag{display:inline-block;padding:3px 8px;border-radius:3px}.green{background:#f0f9eb;color:#529b2e}.red{background:#fef0f0;color:#c45656}.blue{background:#ecf5ff;color:#337ecc}.orange{background:#fdf6ec;color:#b88230}.link{border:0;background:none;padding:0 5px;color:#409eff}.link.red{color:#f56c6c}.empty{text-align:center;color:#909399;padding:35px}.pager{display:flex;justify-content:flex-end;gap:10px;padding:14px 0 2px;color:#606266}.modalback{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modalback.show{display:flex}.modal{width:min(600px,100%);background:#fff;border-radius:5px;box-shadow:0 8px 30px #0002}.modalhead{padding:15px 20px;border-bottom:1px solid #ebeef5;font-size:15px;font-weight:600;display:flex;justify-content:space-between}.modalbody{padding:20px}.formrow{display:grid;grid-template-columns:110px 1fr;gap:12px;margin-bottom:15px;align-items:center}.formrow label{text-align:right;color:#606266}.formrow input,.formrow select{width:100%;height:34px;border:1px solid #dcdfe6;border-radius:3px;padding:0 9px}.modalfoot{padding:12px 20px;border-top:1px solid #ebeef5;display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);background:#303133;color:#fff;padding:10px 18px;border-radius:4px;display:none;z-index:10}.toast.show{display:block}.hint{font-size:12px;color:#909399;margin-top:6px}@media(max-width:850px){.overview{grid-template-columns:repeat(3,minmax(0,1fr))}.content{padding:7px}.filters{gap:8px}}
</style><script src="seed.js"></script><script src="engine.js"></script></head><body><div class="content">
<section class="overview">
<div class="metric"><div class="metric-label">号码总数</div><div class="metric-value" id="total">0</div></div>
<div class="metric"><div class="metric-label">未占用</div><div class="metric-value" id="free">0</div></div>
<div class="metric"><div class="metric-label">已占用</div><div class="metric-value" id="used">0</div></div>
<div class="metric"><div class="metric-label">可售</div><div class="metric-value" id="saleable">0</div></div>
<div class="metric"><div class="metric-label">不可售</div><div class="metric-value" id="unsaleable">0</div></div>
</section>
<section class="panel filters">
<div class="field"><label>靓号号码</label><input id="qNumber" placeholder="请输入完整号码"></div>
<div class="field"><label>靓号等级</label><select id="qLevel"><option value="">全部等级</option><option>SS3</option><option>SS2</option><option>SS1</option><option>S3</option><option>S2</option><option>S1</option><option>A</option><option>B</option><option>C</option></select></div>
<div class="field"><label>占用状态</label><select id="qUse"><option value="">全部</option><option value="free">未占用</option><option value="used">已占用</option></select></div>
<div class="field"><label>销售状态</label><select id="qSale"><option value="">全部</option><option value="available">可售</option><option value="unavailable">不可售</option></select></div>
<button class="primary" onclick="render()">搜索</button><button onclick="resetFilters()">重置</button>
</section>
<section class="panel"><div class="toolbar"><button class="primary" onclick="openAdd()">＋ 补录号码</button><span class="hint">补录支持批量添加；新补录号码默认不可售</span></div>
<div class="batch" id="batch"><span>已选择 <b id="selectedCount">0</b> 条</span><button onclick="bulkSale('available')" class="success">设为可售</button><button onclick="bulkSale('unavailable')" class="danger">设为不可售</button><button onclick="clearSelected()">取消选择</button></div>
<div class="tablewrap"><table><thead><tr><th><input type="checkbox" id="all" onchange="selectAll(this.checked)"></th><th>靓号号码</th><th>靓号等级</th><th>占用状态</th><th>销售状态</th><th>当前号主 UID</th><th>绑定时间</th><th>到期时间</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></div>
<div class="pager"><span id="count"></span></div></section></div>
<div class="modalback" id="modal"><div class="modal"><div class="modalhead"><span id="modalTitle">补录号码</span><button onclick="closeModal()">×</button></div><div class="modalbody" id="modalBody"></div><div class="modalfoot"><button onclick="closeModal()">取消</button><button class="primary" onclick="submitModal()">确定</button></div></div></div><div class="toast" id="toast"></div>
<script>
const levels=["SS3","SS2","SS1","S3","S2","S1","A","B","C"];let rows=[],selected=new Set(),action="",activeId="";
function load(){rows=SpecialDemo.read().pool}
function render(){load();const q=document.getElementById("qNumber").value.trim(),lev=document.getElementById("qLevel").value,use=document.getElementById("qUse").value,sale=document.getElementById("qSale").value;const list=rows.filter(r=>(!q||r.id.includes(q))&&(!lev||r.level===lev)&&(!use||r.use===use)&&(!sale||r.sale===sale));document.getElementById("tbody").innerHTML=list.map(r=>'<tr><td><input type="checkbox" '+(selected.has(r.id)?"checked":"")+' onchange="selectOne(\''+r.id+'\',this.checked)"></td><td><b>'+r.id+'</b></td><td><span class="tag blue">'+r.level+'</span></td><td><span class="tag '+(r.use==="used"?"orange":"green")+'">'+(r.use==="used"?"已占用":"未占用")+'</span></td><td><span class="tag '+(r.sale==="available"?"green":"red")+'">'+(r.sale==="available"?"可售":"不可售")+'</span></td><td>'+(r.uid||"—")+'</td><td>'+(r.bindTime||"—")+'</td><td>'+(r.expiry||"—")+'</td><td><button class="link '+(r.sale==="available"?"red":"")+'" onclick="toggleSale(\''+r.id+'\')">'+(r.sale==="available"?"设为不可售":"设为可售")+'</button></td></tr>').join("")||'<tr><td colspan="9" class="empty">暂无符合条件的号码</td></tr>';document.getElementById("count").textContent="共 "+list.length+" 条";document.getElementById("total").textContent=rows.length;document.getElementById("free").textContent=rows.filter(x=>x.use==="free").length;document.getElementById("used").textContent=rows.filter(x=>x.use==="used").length;document.getElementById("saleable").textContent=rows.filter(x=>x.sale==="available").length;document.getElementById("unsaleable").textContent=rows.filter(x=>x.sale==="unavailable").length;document.getElementById("selectedCount").textContent=selected.size;document.getElementById("batch").classList.toggle("show",selected.size>0);document.getElementById("all").checked=list.length>0&&list.every(x=>selected.has(x.id))}
function resetFilters(){["qNumber","qLevel","qUse","qSale"].forEach(id=>document.getElementById(id).value="");render()}
function selectOne(id,on){on?selected.add(id):selected.delete(id);render()}function selectAll(on){load();const q=document.getElementById("qNumber").value.trim(),lev=document.getElementById("qLevel").value,use=document.getElementById("qUse").value,sale=document.getElementById("qSale").value;rows.filter(r=>(!q||r.id.includes(q))&&(!lev||r.level===lev)&&(!use||r.use===use)&&(!sale||r.sale===sale)).forEach(r=>on?selected.add(r.id):selected.delete(r.id));render()}function clearSelected(){selected.clear();render()}
function toggleSale(id){const v=SpecialDemo.read(),r=v.pool.find(x=>x.id===id);if(!r)return;r.sale=r.sale==="available"?"unavailable":"available";SpecialDemo.updatePool(v.pool);render();toast("销售状态已更新（原型演示）")}
function bulkSale(status){const v=SpecialDemo.read();v.pool.forEach(r=>{if(selected.has(r.id))r.sale=status});SpecialDemo.updatePool(v.pool);selected.clear();render();toast("批量修改销售状态成功（原型演示）")}
function openAdd(){action="add";document.getElementById("modalTitle").textContent="补录号码";document.getElementById("modalBody").innerHTML='<div class="formrow"><label>靓号号码</label><div><textarea id="numbers" placeholder="每行输入一个六位号码" style="width:100%;height:110px;border:1px solid #dcdfe6;padding:9px"></textarea><div class="hint">支持批量添加，每行一个号码；号码默认不可售。</div></div></div><div class="formrow"><label>靓号等级</label><select id="addLevel"><option value="">请选择等级</option>'+levels.map(x=>'<option>'+x+'</option>').join("")+'</select></div>';openModal()}
function submitModal(){const v=SpecialDemo.read();if(action==="add"){const ids=[...new Set(document.getElementById("numbers").value.split(/\s+/).map(x=>x.trim()).filter(Boolean))],level=document.getElementById("addLevel").value;if(!ids.length||!level){toast("请填写号码并选择等级");return}if(ids.some(id=>!/^[1-9]\d{5}$/.test(id)||v.pool.some(r=>r.id===id))){toast("号码格式错误或号码已存在，请检查后重试");return}ids.forEach(id=>v.pool.unshift({id,level,use:"free",sale:"unavailable",mall:"unlisted",uid:"—",bindTime:"—",expiry:"—"}));SpecialDemo.updatePool(v.pool);closeModal();render();toast("补录成功（原型演示）")}}
function openModal(){document.getElementById("modal").classList.add("show")}function closeModal(){document.getElementById("modal").classList.remove("show")}function toast(s){const e=document.getElementById("toast");e.textContent=s;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2000)}
window.addEventListener("storage",render);render();
</script></body></html>
