<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yaloka 后台 - 用户靓号列表</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f3f5;color:#303133;font:13px/1.5 Arial,"Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #dcdfe6;background:#fff;border-radius:3px;padding:7px 13px;color:#606266}.primary{background:#409eff;border-color:#409eff;color:#fff}.danger{color:#f56c6c;border-color:#fbc4c4}.content{padding:12px}.panel{background:#fff;border:1px solid #e4e7ed;border-radius:5px;padding:15px;margin-bottom:10px}.filters{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.field{display:flex;align-items:center;gap:7px}.field input,.field select{height:32px;border:1px solid #dcdfe6;border-radius:3px;padding:0 9px;min-width:145px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:center}th{background:#f5f7fa;height:38px;border:1px solid #ebeef5}td{height:48px;border:1px solid #ebeef5;padding:7px 10px}.tag{display:inline-block;padding:3px 8px;border-radius:3px;background:#ecf5ff;color:#337ecc}.source-manual{background:#fdf6ec;color:#b88230}.source-store{background:#ecf5ff;color:#337ecc}.link{border:0;background:none;padding:0 5px;color:#409eff}.link.red{color:#f56c6c}.empty{text-align:center;color:#909399;padding:35px}.pager{display:flex;justify-content:flex-end;gap:10px;padding:14px 0 2px;color:#606266}.modalback{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modalback.show{display:flex}.modal{width:min(520px,100%);background:#fff;border-radius:5px;box-shadow:0 8px 30px #0002}.modalhead{padding:15px 20px;border-bottom:1px solid #ebeef5;font-size:15px;font-weight:600;display:flex;justify-content:space-between}.x{border:0;font-size:20px;padding:0}.modalbody{padding:20px}.formrow{display:grid;grid-template-columns:100px 1fr;gap:12px;margin-bottom:15px;align-items:center}.formrow label{text-align:right;color:#606266}.formrow input,.formrow select{width:100%;height:34px;border:1px solid #dcdfe6;border-radius:3px;padding:0 9px}.modalfoot{padding:12px 20px;border-top:1px solid #ebeef5;display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);background:#303133;color:#fff;padding:10px 18px;border-radius:4px;display:none;z-index:10}.toast.show{display:block}
</style><script src="seed.js"></script><script src="engine.js"></script></head><body>
<div class="content">
<section class="panel filters">
<div class="field"><label>用户 UID</label><input id="qUid" placeholder="请输入用户 UID"></div>
<div class="field"><label>靓号等级</label><select id="qLevel"><option value="">全部等级</option><option>SS3</option><option>SS2</option><option>SS1</option><option>S3</option><option>S2</option><option>S1</option><option>A</option><option>B</option><option>C</option></select></div>
<div class="field"><label>获取方式</label><select id="qSource"><option value="">全部</option><option value="人工分配">人工分配</option><option value="商城购买">商城购买</option></select></div>
<button class="primary" onclick="render()">搜索</button><button onclick="resetFilters()">重置</button>
</section>
<section class="panel"><div class="toolbar"><b>用户靓号列表</b><button class="primary" onclick="openManual()">＋ 人工分配</button></div>
<div class="tablewrap"><table><thead><tr><th>用户 UID</th><th>Special ID</th><th>靓号等级</th><th>获取方式</th><th>绑定时间</th><th>到期时间</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></div>
<div class="pager"><span id="count"></span></div></section></div>
<div class="modalback" id="modal"><div class="modal"><div class="modalhead"><span id="modalTitle">人工分配</span><button class="x" onclick="closeModal()">×</button></div><div class="modalbody" id="fields"></div><div class="modalfoot"><button onclick="closeModal()">取消</button><button class="primary" onclick="submitAction()">确定</button></div></div></div><div class="toast" id="toast"></div>
<script>
const levels=["SS3","SS2","SS1","S3","S2","S1","A","B","C"];let rows=[],mode="",activeId="";
function data(){rows=SpecialDemo.read().pool.filter(r=>r.use==="used");}
function render(){data();const uid=document.getElementById("qUid").value.trim(),level=document.getElementById("qLevel").value,source=document.getElementById("qSource").value;const list=rows.filter(r=>(!uid||String(r.uid).includes(uid))&&(!level||r.level===level)&&(!source||r.source===source));document.getElementById("tbody").innerHTML=list.map(r=>'<tr><td>'+r.uid+'</td><td><b>'+r.id+'</b></td><td><span class="tag">'+r.level+'</span></td><td><span class="tag '+(r.source==="商城购买"?"source-store":"source-manual")+'">'+(r.source||"—")+'</span></td><td>'+(r.bindTime||"—")+'</td><td>'+(r.expiry||"—")+'</td><td><button class="link" onclick="openRenew(\''+r.id+'\')">续期</button><button class="link" onclick="openSwitch(\''+r.id+'\')">换号</button><button class="link red" onclick="recycle(\''+r.id+'\')">回收</button></td></tr>').join("")||'<tr><td colspan="7" class="empty">暂无符合条件的记录</td></tr>';document.getElementById("count").textContent="共 "+list.length+" 条";}
function resetFilters(){["qUid","qLevel","qSource"].forEach(id=>document.getElementById(id).value="");render()}
function openManual(){mode="manual";activeId="";document.getElementById("modalTitle").textContent="人工分配";document.getElementById("fields").innerHTML='<div class="formrow"><label>用户 UID</label><input id="fUid" placeholder="请输入用户 UID"></div><div class="formrow"><label>Special ID</label><input id="fNumber" maxlength="6" inputmode="numeric" placeholder="请输入六位号码"></div><div class="formrow"><label>靓号等级</label><select id="fLevel"><option value="">请选择等级</option>'+levels.map(x=>'<option>'+x+'</option>').join("")+'</select></div><div class="formrow"><label>有效天数</label><input id="fDays" type="number" min="1" value="30"></div>';openModal()}
function openRenew(id){mode="renew";activeId=id;const r=rows.find(x=>x.id===id);document.getElementById("modalTitle").textContent="续期";document.getElementById("fields").innerHTML='<div class="formrow"><label>当前号码</label><input disabled value="'+r.id+'"></div><div class="formrow"><label>续期天数</label><input id="fDays" type="number" min="1" value="30"></div>';openModal()}
function openSwitch(id){mode="switch";activeId=id;const r=rows.find(x=>x.id===id);document.getElementById("modalTitle").textContent="换号";document.getElementById("fields").innerHTML='<div class="formrow"><label>当前号码</label><input disabled value="'+r.id+'"></div><div class="formrow"><label>新 Special ID</label><input id="fNumber" maxlength="6" inputmode="numeric" placeholder="请输入号码池中的号码"></div><div class="formrow"><label>新号码等级</label><select id="fLevel"><option value="">请选择等级</option>'+levels.map(x=>'<option>'+x+'</option>').join("")+'</select></div><div class="formrow"><label>有效天数</label><input id="fDays" type="number" min="1" value="30"></div>';openModal()}
function submitAction(){const v=SpecialDemo.read(),pool=v.pool;const days=Number(document.getElementById("fDays")?.value);if(mode==="manual"){const uid=document.getElementById("fUid").value.trim(),id=document.getElementById("fNumber").value.trim(),level=document.getElementById("fLevel").value;if(!uid||!/^[1-9]\d{5}$/.test(id)||!level||!Number.isSafeInteger(days)||days<1){toast("请填写有效的 UID、六位号码、等级及有效天数");return}let r=pool.find(x=>x.id===id);if(r?.use==="used"){toast("该号码已被占用");return}if(r&&r.level!==level){toast("号码等级与号码池记录不一致");return}if(!r){r={id,level,use:"free",sale:"unavailable",mall:"unlisted",uid:"—",bindTime:"—",expiry:"—",created:SpecialDemo.format(SpecialDemo.now()),updated:SpecialDemo.format(SpecialDemo.now())};pool.unshift(r)}pool.filter(x=>x.use==="used"&&x.uid===uid).forEach(x=>{x.use="free";x.uid="—";x.source="";x.bindTime="—";x.expiry="—"});r.use="used";r.uid=uid;r.source="人工分配";r.sale="unavailable";r.bindTime=SpecialDemo.format(SpecialDemo.now());r.expiry=SpecialDemo.format(SpecialDemo.now()+days*SpecialDemo.day)}
else{const r=pool.find(x=>x.id===activeId);if(!r)return;if(!Number.isSafeInteger(days)||days<1){toast("请输入有效天数");return}if(mode==="renew"){let expiry=SpecialDemo.parse(r.expiry);if(expiry<SpecialDemo.now())expiry=SpecialDemo.now();r.expiry=SpecialDemo.format(expiry+days*SpecialDemo.day)}else if(mode==="switch"){const id=document.getElementById("fNumber").value.trim(),level=document.getElementById("fLevel").value,nr=pool.find(x=>x.id===id);if(!nr||nr.use==="used"||nr.level!==level){toast("请选择号码池中未占用且等级匹配的号码");return}nr.use="used";nr.uid=r.uid;nr.source=r.source;nr.bindTime=SpecialDemo.format(SpecialDemo.now());nr.expiry=SpecialDemo.format(SpecialDemo.now()+days*SpecialDemo.day);r.use="free";r.uid="—";r.source="";r.bindTime="—";r.expiry="—"}}SpecialDemo.updatePool(pool);closeModal();render();toast(mode==="renew"?"续期成功（原型演示）":mode==="switch"?"换号成功（原型演示）":"人工分配成功（原型演示）")}
function recycle(id){if(!confirm("确认回收该 Special ID？回收后号码将立即释放。"))return;const v=SpecialDemo.read(),r=v.pool.find(x=>x.id===id);if(!r)return;r.use="free";r.uid="—";r.source="";r.bindTime="—";r.expiry="—";SpecialDemo.updatePool(v.pool);render();toast("回收成功（原型演示）")}
function openModal(){document.getElementById("modal").classList.add("show")}function closeModal(){document.getElementById("modal").classList.remove("show")}function toast(s){const e=document.getElementById("toast");e.textContent=s;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2000)}
window.addEventListener("storage",render);render();
</script></body></html>
