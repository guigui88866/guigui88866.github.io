<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>代理积分赛运营后台</title>
<style>
:root{--bg:#f2f4f7;--panel:#fff;--line:#e5e9ef;--text:#263445;--muted:#78869a;--blue:#3294f5;--blue-dark:#237bd1;--green:#37b36b;--red:#ec6262;--orange:#f1a13b;--shadow:0 2px 8px #20334a12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.sidebar{position:fixed;inset:0 auto 0 0;width:220px;background:#172436;color:#c9d4e3;padding:19px 12px}.brand{color:#fff;font-size:17px;font-weight:700;padding:4px 13px 26px}.brand small{display:block;color:#93a4bc;font-size:11px;font-weight:400;margin-top:4px}.group-title{color:#7f92ad;font-size:11px;padding:11px 14px 5px}.menu{display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:5px;margin:3px 0;color:#cfdae8;cursor:pointer}.menu:hover{background:#22334b}.menu.active{background:#2f8fe8;color:#fff}.menu i{font-style:normal;width:16px;text-align:center}.main{margin-left:220px;padding:17px 20px 36px;max-width:1750px}.crumb{font-size:12px;color:#8390a2;margin-bottom:7px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.title{font-size:19px;font-weight:700;color:#263547}.operator{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 12px;color:#68778b;font-size:12px}.panel{background:#fff;border:1px solid #e7e9ed;border-radius:7px;box-shadow:var(--shadow);margin-bottom:10px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:9px}.payout-summary{grid-template-columns:repeat(3,1fr)}.summary-card{padding:11px 14px;min-height:62px}.summary-label{font-size:11px;color:#8692a3}.summary-value{font-size:20px;font-weight:700;margin-top:2px;color:#24344a}.summary-value.blue{color:#3294f5}.summary-value.orange{color:#f29a32}.summary-value.green{color:#28a66b}.filters{display:flex;flex-wrap:wrap;gap:11px;align-items:end;padding:12px 13px;margin-bottom:10px}.payout-filters{flex-wrap:nowrap;align-items:center}.payout-filters .field{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap}.payout-filters .field label{margin:0;white-space:nowrap}.payout-filters .field select{min-width:150px}.payout-filters .field.wide input{width:190px;min-width:190px}.field{min-width:140px}.field.wide{min-width:190px}.field label{display:block;color:#647286;font-size:11px;margin-bottom:5px}.field select,.field input,.input{height:30px;border:1px solid #d9dfe8;border-radius:4px;background:#fff;padding:0 9px;color:#38485d;min-width:140px;outline:none}.field.wide input{width:190px}.btn{border:1px solid #d8dfe8;background:#fff;color:#57677b;border-radius:4px;height:30px;padding:0 12px;cursor:pointer;font-size:12px}.btn.primary{background:#3294f5;border-color:#3294f5;color:#fff}.btn.green{background:#36b56a;border-color:#36b56a;color:#fff}.btn.orange{background:#f0a13b;border-color:#f0a13b;color:#fff}.btn:disabled{opacity:.42;cursor:not-allowed}.table-head{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line)}.table-title{font-weight:700;font-size:13px}.table-sub{color:#8b97a7;font-size:11px;margin-left:9px}.toolset{display:flex;gap:7px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{font-size:11px;font-weight:600;color:#58677b;background:#f5f7fa;border:1px solid #e8ecf1;padding:9px 10px;text-align:center}td{font-size:12px;border:1px solid #e8ecf1;padding:9px 10px;text-align:center;vertical-align:middle}tr:hover td{background:#fbfcfe}.rank{font-weight:700;color:#516176}.rank.top{color:#c88a20}.agent{display:flex;align-items:center;gap:8px;text-align:left;min-width:148px}.avatar{width:31px;height:31px;flex:none;border-radius:50%;background:#e7eef9;color:#5078b7;display:grid;place-items:center;font-weight:700}.agent-name{font-weight:600;color:#304157}.subline{color:#8a96a7;font-size:10px;margin-top:2px}.points{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;color:#2b3c53}.hostchips{display:flex;justify-content:center;gap:5px}.hostchip{display:flex;align-items:center;gap:4px;border-radius:15px;background:#f4f6f8;padding:3px 7px 3px 3px;color:#536174;font-size:10px}.hostchip .avatar{width:21px;height:21px;font-size:9px}.place{font-size:10px;color:#bf8a2b}.count-cell strong{font-size:13px}.count-cell span{color:#98a2b0;font-size:10px;margin-left:3px}.status{display:inline-block;border-radius:3px;padding:3px 8px;font-size:10px}.status.ok{color:#209459;background:#e7f7ed;border:1px solid #cdeed8}.status.no{color:#df5c5c;background:#fff0ef;border:1px solid #f8d5d2}.status.pending{color:#d68a25;background:#fff6e8;border:1px solid #f7e0bd}.status.paid{color:#23965e;background:#e8f7ee;border:1px solid #cdeed8}.status.none{color:#7d8794;background:#f2f3f5;border:1px solid #e4e6e9}.link{color:#3294f5;background:none;border:0;cursor:pointer;padding:0 4px;font-size:11px}.pagination{display:flex;justify-content:space-between;align-items:center;padding:10px 13px;color:#78869a;font-size:11px}.pages{display:flex;gap:4px;align-items:center}.page{width:25px;height:24px;border:1px solid #e0e5eb;border-radius:3px;background:white;display:grid;place-items:center}.page.active{border-color:#8bbef3;color:#2389e8;background:#f2f8ff}.hint{font-size:11px;color:#8a96a7;padding:0 13px 10px}.hidden{display:none!important}.modal-mask{display:none;position:fixed;inset:0;background:#17243670;z-index:10;align-items:center;justify-content:center;padding:18px}.modal{width:min(720px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:8px;box-shadow:0 16px 50px #14243a33}.modal-head{padding:14px 18px;border-bottom:1px solid var(--line);font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center}.close{border:0;background:none;font-size:21px;color:#8793a3;cursor:pointer}.modal-body{padding:16px 18px}.modal-foot{padding:11px 18px;border-top:1px solid var(--line);text-align:right}.detail-summary{display:flex;justify-content:space-between;align-items:center;background:#f7f9fc;border:1px solid #edf0f4;border-radius:5px;padding:10px 12px;margin-bottom:13px}.detail-summary b{font-size:15px}.toast{display:none;position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:30;background:#243349;color:white;padding:9px 17px;border-radius:5px;box-shadow:var(--shadow)}.payout-meta{font-size:11px;color:#8a96a7;margin-right:auto}.confirm-grid{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center}.confirm-grid label{color:#68778a}.confirm-grid input,.confirm-grid textarea{width:100%;border:1px solid #dbe1e9;border-radius:4px;padding:8px}.confirm-grid textarea{height:66px;resize:vertical}.pill{padding:3px 7px;border-radius:10px;background:#eff5fd;color:#4771a9;font-size:10px}.settle-action{color:#39a86a}
@media(max-width:1000px){.sidebar{width:184px}.main{margin-left:184px;padding:14px}.summary{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.sidebar{display:none}.main{margin:0;padding:12px}.filters{gap:8px}.field{flex:1;min-width:140px}.summary-card{padding:9px}.summary-value{font-size:17px}}
</style></head>
<body>
<aside class="sidebar"><div class="brand">YALOKA Admin<small>运营管理后台</small></div><div class="group-title">活动运营</div><div class="menu active" id="menuPayout" onclick="showPage()"><i>＄</i>财务打款</div></aside>
<main class="main"><div class="crumb">活动运营　/　代理积分赛　/　<span id="crumbCurrent">财务打款</span></div><header class="header"><div class="title" id="pageTitle">财务打款</div><div class="operator">运营管理员　⌄</div></header>
<section id="payoutPage">
<div class="summary payout-summary"><div class="panel summary-card"><div class="summary-label">月榜 TOP 3 现金奖励总额</div><div class="summary-value">$60.00</div></div><div class="panel summary-card"><div class="summary-label">待结算金额</div><div class="summary-value blue" id="pendingTotal">$30.00</div></div><div class="panel summary-card"><div class="summary-label">已结算金额</div><div class="summary-value green" id="paidTotal">$20.00</div></div></div>
<div class="panel filters payout-filters"><div class="field"><label>结算周期</label><select id="payoutMonth"><option>第4期（2026-11-01-2026-11-30）</option><option>第3期（2026-10-01-2026-10-31）</option></select></div><div class="field wide"><label>代理 ID / 昵称</label><input id="payoutQuery" placeholder="请输入代理 ID 或昵称"></div><div class="field"><label>结算状态</label><select id="payoutStatusFilter"><option value="all">全部</option><option value="pending">待结算</option><option value="paid">已结算</option><option value="none">无需结算</option></select></div><div class="field"><label>角色状态</label><select id="roleStatusFilter"><option value="all">全部</option><option value="enabled">启用</option><option value="disabled">禁用</option><option value="invalid">失效</option></select></div><button class="btn primary" onclick="searchPayouts()">⌕ 查询</button><button class="btn" onclick="resetPayouts()">↻ 重置</button><button class="btn orange" onclick="toast('已导出当前查询结果')">⇩ 导出</button></div>
<div class="panel"><div class="table-head"><div><span class="table-title">月榜现金奖励打款</span></div></div><div class="table-wrap"><table><thead><tr><th>结算周期</th><th>排名</th><th>代理信息</th><th>角色状态</th><th>Peak Points</th><th>有效主播人数</th><th>是否达标</th><th>应打款金额（USD）</th><th>结算状态</th><th>结算时间</th><th>操作</th></tr></thead><tbody id="payoutRows"></tbody></table></div><div class="pagination"><span>共 <b id="payoutCount">3</b> 条</span><div class="pages"><span class="page">‹</span><span class="page active">1</span><span class="page">›</span></div></div></div>
</section></main>
<div class="modal-mask" id="payModal" onclick="if(event.target===this)closePay()"><div class="modal" style="width:min(480px,100%)"><div class="modal-head"><span>更新为已结算</span><button class="close" onclick="closePay()">×</button></div><div class="modal-body"><div id="payAgentLabel" style="margin-bottom:14px;font-weight:600"></div><div class="confirm-grid"><label>打款金额（USD）</label><input id="payAmount" type="number" step="0.01"><label>打款凭证 / 流水号</label><input id="payReference" placeholder="请输入银行流水号或凭证编号"><label>备注</label><textarea id="payRemark" placeholder="选填"></textarea></div></div><div class="modal-foot"><button class="btn" onclick="closePay()">取消</button> <button class="btn primary" onclick="confirmPay()">确认结算</button></div></div></div>
<div class="modal-mask" id="receiptModal" onclick="if(event.target===this)closeReceipt()"><div class="modal" style="width:min(480px,100%)"><div class="modal-head"><span>收款信息</span><button class="close" onclick="closeReceipt()">×</button></div><div class="modal-body" id="receiptBody"></div><div class="modal-foot"><button class="btn" onclick="closeReceipt()">关闭</button></div></div></div><div class="toast" id="toast"></div>
<script>
const payoutData=[
 {month:'第4期（2026-11-01-2026-11-30）',rank:1,id:'771',name:'YYDS',points:42860,validHosts:18,amount:30,roleStatus:'enabled',status:'pending',paidAt:'—',reference:'—',remark:''},
 {month:'第4期（2026-11-01-2026-11-30）',rank:2,id:'515',name:'Golden Agency',points:38420,validHosts:16,amount:20,roleStatus:'disabled',status:'paid',paidAt:'2026-11-06 10:30',reference:'TXN-20261106-002',remark:'银行转账'},
 {month:'第4期（2026-11-01-2026-11-30）',rank:3,id:'650',name:'Sunrise Agency',points:35180,validHosts:12,amount:0,roleStatus:'invalid',status:'none',paidAt:'—',reference:'—',remark:''}
];let payingId=null;
function renderPayout(rows=payoutData){document.getElementById('payoutRows').innerHTML=rows.map(r=>{const ok=r.validHosts>=15;const statusLabel=r.status==='pending'?'待结算':r.status==='paid'?'已结算':'无需结算';const statusClass=r.status==='pending'?'pending':r.status==='paid'?'paid':'none';const roleLabel={enabled:'启用',disabled:'禁用',invalid:'失效'}[r.roleStatus]||'—';const roleClass={enabled:'ok',disabled:'no',invalid:'none'}[r.roleStatus]||'none';const action=`<button class="link" onclick="showReceipt('${r.id}')">◎ 收款信息</button>`+(r.status==='pending'?` <button class="link settle-action" onclick="openPay('${r.id}')">✓ 更新为已结算</button>`:'');return `<tr><td>${r.month}</td><td><span class="rank top">TOP ${r.rank}</span></td><td><div class="agent"><div class="avatar">${r.name[0]}</div><div><div class="agent-name">${r.name}</div><div class="subline">代理 ID：${r.id}</div></div></div></td><td><span class="status ${roleClass}">${roleLabel}</span></td><td><span class="points">${r.points.toLocaleString()}</span></td><td class="count-cell"><strong>${r.validHosts}</strong><span>/ 15 人</span></td><td><span class="status ${ok?'ok':'no'}">${ok?'达标':'未达标'}</span></td><td class="points">${r.amount?'$'+r.amount.toFixed(2):'—'}</td><td><span class="status ${statusClass}">${statusLabel}</span></td><td>${r.paidAt}</td><td>${action}</td></tr>`}).join('');document.getElementById('payoutCount').textContent=rows.length;const paid=payoutData.filter(x=>x.status==='paid').reduce((a,x)=>a+x.amount,0),pending=payoutData.filter(x=>x.status==='pending').reduce((a,x)=>a+x.amount,0);document.getElementById('paidTotal').textContent='$'+paid.toFixed(2);document.getElementById('pendingTotal').textContent='$'+pending.toFixed(2)}
function searchPayouts(){const q=document.getElementById('payoutQuery').value.trim().toLowerCase(),st=document.getElementById('payoutStatusFilter').value,role=document.getElementById('roleStatusFilter').value;renderPayout(payoutData.filter(r=>(!q||r.id.includes(q)||r.name.toLowerCase().includes(q))&&(st==='all'||r.status===st)&&(role==='all'||r.roleStatus===role)))}function resetPayouts(){document.getElementById('payoutQuery').value='';document.getElementById('payoutStatusFilter').value='all';document.getElementById('roleStatusFilter').value='all';renderPayout()}
function showReceipt(id){const r=payoutData.find(x=>x.id===id);if(!r)return;document.getElementById('receiptBody').innerHTML=`<div class="confirm-grid"><label>代理</label><div>${r.name}（ID：${r.id}）· TOP ${r.rank}</div><label>结算状态</label><div>${r.status==='pending'?'待结算':r.status==='paid'?'已结算':'无需结算'}</div><label>收款金额（USD）</label><div>${r.amount?'$'+r.amount.toFixed(2):'—'}</div><label>打款凭证 / 流水号</label><div>${r.reference||'—'}</div><label>备注</label><div>${r.remark||'—'}</div><label>结算时间</label><div>${r.paidAt}</div></div>`;document.getElementById('receiptModal').style.display='flex'}function closeReceipt(){document.getElementById('receiptModal').style.display='none'}function openPay(id){const r=payoutData.find(x=>x.id===id);if(!r||r.status!=='pending')return;payingId=id;document.getElementById('payAgentLabel').textContent=`${r.name}（代理 ID：${r.id}）· TOP ${r.rank}`;document.getElementById('payAmount').value=r.amount.toFixed(2);document.getElementById('payReference').value='';document.getElementById('payRemark').value='';document.getElementById('payModal').style.display='flex'}function closePay(){document.getElementById('payModal').style.display='none';payingId=null}function confirmPay(){const r=payoutData.find(x=>x.id===payingId),amt=Number(document.getElementById('payAmount').value),ref=document.getElementById('payReference').value.trim();if(!r)return;if(!amt||amt!==r.amount){toast('打款金额需与应打款金额一致');return}if(!ref){toast('请填写打款凭证或流水号');return}r.status='paid';r.paidAt=new Date().toISOString().slice(0,16).replace('T',' ');r.reference=ref;r.remark=document.getElementById('payRemark').value.trim();closePay();renderPayout();toast('已更新为已结算')}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',1600)}renderPayout();
</script></body></html>
