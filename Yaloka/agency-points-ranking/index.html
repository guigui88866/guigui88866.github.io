function updateMonthlyTop1(t){const badge=document.querySelector('.rank.one .medal'),name=document.getElementById('topAgencyName');if(t==='Monthly'){badge.innerHTML='<img src=\"'+monthlyTop1Avatar+'\" alt=\"YYDS\">';name.innerHTML='YYDS<br><span class=\"points\"><i class=\"pointicon\">🏆</i> 37.13K</span>'}else{badge.innerHTML='CROWN<br>771';name.innerHTML='Coffee Agency<br><span class=\"points\"><i class=\"pointicon\">🏆</i> 37.13K</span>'}}
function updateCountdown(){const now=Date.now(),shifted=new Date(now+5*60*60*1000),y=shifted.getUTCFullYear(),m=shifted.getUTCMonth(),d=shifted.getUTCDate();let target;if(tab==='Daily'){target=Date.UTC(y,m,d+1)-5*60*60*1000}else if(tab==='Weekly'){const daysToMonday=(8-shifted.getUTCDay())%7||7;target=Date.UTC(y,m,d+daysToMonday)-5*60*60*1000}else{target=Date.UTC(y,m+1,1)-5*60*60*1000}let left=Math.max(0,Math.floor((target-now)/1000));const dd=Math.floor(left/86400);left%=86400;const hh=Math.floor(left/3600);left%=3600;const mm=Math.floor(left/60);const ss=left%60;document.getElementById('countdownLabel').textContent='Time until '+({Daily:'Daily Ranking',Weekly:'Weekly Ranking',Monthly:'Monthly Ranking'})[tab]+' ends (UTC+5)';document.getElementById('days').textContent=String(dd).padStart(2,'0');document.getElementById('hours').textContent=String(hh).padStart(2,'0');document.getElementById('minutes').textContent=String(mm).padStart(2,'0');document.getElementById('seconds').textContent=String(ss).padStart(2,'0')}
function renderPreviousTop3(t){const labels={Daily:'Yesterday’s TOP 3',Weekly:'Last Week’s TOP 3',Monthly:'Last Month’s TOP 3'};const sets={Daily:[['2','Royal Agency','21.4K'],['1','Coffee Agency','42.8K'],['3','Sunrise Agency','18.2K']],Weekly:[['2','Golden Agency','128K'],['1','Coffee Agency','246K'],['3','Royal Agency','106K']],Monthly:[['2','Sunrise Agency','1.18M'],['1','Coffee Agency','2.43M'],['3','Golden Agency','980K']]};document.getElementById('previousTitle').textContent=labels[t];document.getElementById('previousPodium').innerHTML=sets[t].map((a,i)=>'<div class="previous-agency '+(i===1?'first':'')+'"><div class="previous-badge">TOP '+a[0]+'</div><strong>'+a[1]+'</strong><em>🏆 '+a[2]+'</em><div class="previous-hosts"><span class="host-medal gold"><img src="https://i.pravatar.cc/60?img='+(10+i)+'"></span><span class="host-medal silver"><img src="https://i.pravatar.cc/60?img='+(20+i)+'"></span><span class="host-medal bronze"><img src="https://i.pravatar.cc/60?img='+(30+i)+'"></span></div></div>').join('')}
let monthlyRewardGroup='Agency';
function renderReward(t,group='Agency'){
  if(t==='Monthly') monthlyRewardGroup=group;
  const configs={
    Daily:[[['Beans','× 70,000','◆']],[['Beans','× 42,000','◆']],[['Beans','× 14,000','◆']]],
    Weekly:[[['Coins','× 140,000','●'],['Badge','× 7 Days','✦']],[['Coins','× 84,000','●'],['Badge','× 7 Days','✦']],[['Coins','× 28,000','●'],['Badge','× 7 Days','✦']]],
    Monthly:{
      Agency:[[['Cash','$30','＄'],['Avatar Frame','× 7 Days','▧'],['Room Tag','× 7 Days','⌂'],['Special ID','× 30 Days','ID']],[['Cash','$20','＄'],['Avatar Frame','× 7 Days','▧'],['Room Tag','× 7 Days','⌂'],['Special ID','× 30 Days','ID']],[['Cash','$10','＄'],['Avatar Frame','× 7 Days','▧'],['Room Tag','× 7 Days','⌂'],['Special ID','× 30 Days','ID']]],
      Host:[[['Avatar Frame','× 7 Days','▧'],['Room Tag','× 7 Days','⌂']],[['Avatar Frame','× 7 Days','▧'],['Room Tag','× 7 Days','⌂']],[['Avatar Frame','× 7 Days','▧'],['Room Tag','× 7 Days','⌂']]]
    }
  };
  const ranks=['TOP 1','TOP 2','TOP 3'],monthly=t==='Monthly';
  const itemsByRank=monthly?configs.Monthly[monthlyRewardGroup]:configs[t];
  const groupContent=monthly?`<div class="reward-group-tabs"><button class="reward-group-tab ${monthlyRewardGroup==='Agency'?'active':''}" onclick="renderReward('Monthly','Agency')">Agency</button><button class="reward-group-tab ${monthlyRewardGroup==='Host'?'active':''}" onclick="renderReward('Monthly','Host')">Host</button></div>`:'';
  const sections=itemsByRank.map((items,i)=>`<section class="rank-reward"><div class="rank-reward-title">${ranks[i]}</div><div class="rewardcards ${monthly?'compact':''}">${items.map(r=>`<div class="rewardcard"><div class="reward-thumb">${r[2]}</div><div class="rewardname"><b>${r[0]}</b>${r[1]?`<br>${r[1]}`:''}</div></div>`).join('')}</div></section>`).join('');
  document.getElementById('sheetContent').innerHTML=`<h2>Rewards</h2><div class="rewardtabs">${['Daily','Weekly','Monthly'].map(x=>`<button class="rewardtab ${x===t?'active':''}" onclick="renderReward('${x}')">${x} Ranking</button>`).join('')}</div>${groupContent}<div id="rewardContent">${sections}</div>`;
}
function openModal(type){if(type==='rewards'){renderReward('Daily')}else{document.getElementById('sheetContent').innerHTML=`<h2>Rules</h2><div class="rules-content"><h3>1. Event Period</h3><p>This is an ongoing event starting <b>2026/11/6 (UTC+5)</b>.</p><h3>2. Eligibility</h3><p>All agencies on the platform can participate.</p><h3>3. Ranking Periods</h3><p>Daily, weekly, and monthly rankings are calculated separately. All periods use <b>UTC+5</b>.</p><ul><li>Daily: Each calendar day</li><li>Weekly: Each calendar week</li><li>Monthly: Each calendar month</li></ul><h3>4. Peak Points</h3><p>Peak Points are earned from Coins received by an agency’s hosts through gifts:</p><ul><li>Regular Gifts: <b>1 Coin = 1 Peak Point</b></li><li>Lucky Gifts: <b>10 Coins = 1 Peak Point</b></li></ul><h3>5. Reward Eligibility</h3><p>The top three agencies in each ranking period qualify for rewards only if they meet the corresponding active-host requirement:</p><ul><li><b>Daily:</b> At least 5 hosts, each with 2 valid streaming hours that day.</li><li><b>Weekly:</b> At least 10 hosts, each with 4 valid days and 10 valid hours that week.</li><li><b>Monthly:</b> At least 15 hosts, each with 4 valid days and 10 valid hours that month.</li></ul><p>Agencies that do not meet the requirement will not receive a reward.</p><h3>6. Reward Delivery</h3><p>Rewards are issued based on the final ranking and eligibility after each period ends.</p><ul><li>In-app item rewards will be issued the day after settlement.</li><li>Cash rewards will be processed manually as soon as possible.</li><li>Contact Customer Service to claim a Special ID reward.</li></ul><p class="platform-declaration">The platform reserves the right of final interpretation of this event.</p></div>`}document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1200)}
</script></body></html>
