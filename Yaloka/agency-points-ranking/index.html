  const itemsByRank=monthly?configs.Monthly[monthlyRewardGroup]:configs[t];
  const groupContent=monthly?`<div class="reward-group-tabs"><button class="reward-group-tab ${monthlyRewardGroup==='Agency'?'active':''}" onclick="renderReward('Monthly','Agency')">Agency</button><button class="reward-group-tab ${monthlyRewardGroup==='Host'?'active':''}" onclick="renderReward('Monthly','Host')">Host</button></div>`:'';
  const sections=itemsByRank.map((items,i)=>`<section class="rank-reward"><div class="rank-reward-title">${ranks[i]}</div><div class="rewardcards ${monthly?'compact':''}">${items.map(r=>`<div class="rewardcard"><div class="reward-thumb">${r[2]}</div><div class="rewardname"><b>${r[0]}</b>${r[1]?`<br>${r[1]}`:''}</div></div>`).join('')}</div></section>`).join('');
  document.getElementById('sheetContent').innerHTML=`<h2>Rewards</h2><div class="rewardtabs">${['Daily','Weekly','Monthly'].map(x=>`<button class="rewardtab ${x===t?'active':''}" onclick="renderReward('${x}')">${x} Ranking</button>`).join('')}</div>${groupContent}<div id="rewardContent">${sections}</div>`;
}
function openModal(type){if(type==='rewards'){renderReward('Daily')}else{document.getElementById('sheetContent').innerHTML=`<h2>Peak Points Championship Rules</h2><div class="rules-content"><h3>1. Event Period</h3><p>This is an ongoing event starting <b>2026/11/6 (UTC+5)</b>.</p><h3>2. Eligibility</h3><p>All agencies on the platform can participate.</p><h3>3. Ranking Periods</h3><p>Daily, weekly, and monthly rankings are calculated separately. All periods use <b>UTC+5</b>.</p><ul><li>Daily: Each calendar day</li><li>Weekly: Each calendar week</li><li>Monthly: Each calendar month</li></ul><h3>4. Peak Points</h3><p>Peak Points are earned from Coins received by an agency’s hosts through gifts:</p><ul><li>Regular Gifts: <b>1 Coin = 1 Peak Point</b></li><li>Lucky Gifts: <b>10 Coins = 1 Peak Point</b></li></ul><h3>5. Reward Eligibility</h3><p>The top three agencies in each ranking period qualify for rewards only if they meet the corresponding active-host requirement:</p><ul><li><b>Daily:</b> At least 5 hosts, each with 2 valid streaming hours that day.</li><li><b>Weekly:</b> At least 10 hosts, each with 4 valid days and 10 valid hours that week.</li><li><b>Monthly:</b> At least 15 hosts, each with 4 valid days and 10 valid hours that month.</li></ul><p>Agencies that do not meet the requirement will not receive a reward.</p><h3>6. Reward Delivery</h3><p>Rewards are issued based on the final ranking and eligibility after each period ends.</p><ul><li>In-app item rewards will be issued the day after settlement.</li><li>Cash rewards will be processed manually as soon as possible.</li><li>Contact Customer Service to claim a Special ID reward.</li></ul><p class="platform-declaration">The platform reserves the right of final interpretation of this event.</p></div>`}document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1200)}
</script></body></html>
