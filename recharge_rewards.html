<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Recharge Rewards</title><style>
*{box-sizing:border-box}body{margin:0;background:#050505;font-family:Arial,'Microsoft YaHei',sans-serif;color:#d9bf7a}.phone{max-width:430px;height:100dvh;min-height:550px;margin:auto;background:linear-gradient(180deg,#070707,#11100d 45%,#080808);display:flex;flex-direction:column;border:1px solid #826b43;color:#d9bf7a}.scroll{overflow-y:auto;flex:1;padding:14px 12px 28px;background:radial-gradient(ellipse at 50% 5%,#262018,#0a0908 36%,#080808)}.header{display:flex;justify-content:center;align-items:center;position:relative;height:104px;margin:0 -3px 4px;border-bottom:1px solid #56462d}.header:before,.header:after{content:'◆';position:absolute;color:#83a9ba;text-shadow:1px 1px #e4ca88;font-size:15px;bottom:-11px}.header:before{left:15px}.header:after{right:15px}.header h1{font-family:Georgia,serif;font-size:25px;letter-spacing:.2px;color:#e9d49a;text-shadow:0 2px 2px #000;background:linear-gradient(#282015,#080808 45%,#1b140b);border:1px solid #d6b977;outline:2px solid #4b3820;border-radius:6px;padding:17px 16px;box-shadow:inset 0 2px 5px #75613b66,0 4px 12px #000;max-width:calc(100% - 46px);margin:0}.rule{position:absolute;right:-9px;top:0;border:1px solid #ab8d54;border-radius:16px 0 0 16px;background:linear-gradient(#302719,#090807);color:#f1dcaa;font-family:Georgia,serif;padding:7px 13px;cursor:pointer}.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #9b804f;background:#0a0908;border-radius:7px;overflow:hidden;margin:16px 0 18px;box-shadow:0 1px 0 #ddc58a,inset 0 0 8px #5c462433}.tabs button{border:0;background:transparent;color:#c7af7c;border-right:1px solid #4c3d25;font-weight:600;letter-spacing:.1px;padding:11px 3px;font-size:14px;line-height:16px;cursor:pointer}.tabs button:last-child{border-right:0}.tabs button.active{background:linear-gradient(180deg,#f8e7bb,#c6a267 70%,#8c693b);color:#251a0c;border-radius:5px;box-shadow:inset 0 1px 3px #fff8d6}.countdown{display:flex;justify-content:center;align-items:flex-start;gap:7px;width:100%;margin:16px auto 8px}.timeunit{text-align:center;width:52px;flex:0 0 52px}.digits{height:45px;border:1px solid #b99c65;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;background:linear-gradient(#282015,#0b0a08);color:#f2dfa9;box-shadow:inset 0 1px 4px #705a3833}.timeunit small{display:block;margin-top:5px;font-size:10px;color:#c5ae7d}.colon{height:45px;display:flex;align-items:center;font-weight:bold;color:#dfca98}.hint{text-align:center;font-size:12px;margin:15px 0 27px;line-height:1.5;color:#a99972}.tier{position:relative;border:1px solid #89724a;border-radius:7px;padding:33px 12px 15px;margin:0 0 28px;background:linear-gradient(180deg,#17130e,#0e0d0b 72%,#1b160f);box-shadow:inset 0 0 0 1px #352a1a,0 4px 9px #0008}.tier:before,.tier:after{content:'◆';position:absolute;top:7px;font-size:12px;color:#91b3c0;text-shadow:1px 1px #8e733f}.tier:before{left:7px}.tier:after{right:7px}.tierhead{position:absolute;top:-17px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#4a3b25,#19150e 45%,#090807);border:1px solid #d7bb7e;border-radius:5px;color:#f2dfa9;box-shadow:inset 0 1px #897247,0 3px 8px #000;padding:8px 14px;min-width:224px;white-space:nowrap;text-align:center;font-size:13px}.tierhead:before,.tierhead:after{content:'❖';position:absolute;top:5px;color:#d9c184}.tierhead:before{left:6px}.tierhead:after{right:6px}.coin{display:inline-flex;width:13px;height:13px;vertical-align:-2px;margin:0 3px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff2c6,#d5ad55 60%,#8c6228);border:1px solid #f5dc9c;box-shadow:0 0 0 1px #66512b}.coin:after{content:'★';font-size:8px;line-height:11px;display:block;text-align:center;color:#79511c}.reward{min-width:0;text-align:center}.thumb{height:57px;border:1px solid #806b48;border-radius:5px;position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#292319,#0b0a08 65%,#302516);color:#bba778;font-size:12px;box-shadow:inset 0 0 8px #ae88421b}.thumb::after{content:'▶';position:absolute;top:4px;right:5px;border-radius:50%;background:#7e6740;color:#f3e4b5;font-size:8px;width:13px;height:13px;display:grid;place-items:center}.rewardlabel{font-size:11px;line-height:1.35;margin-top:5px;overflow-wrap:anywhere;color:#ead8ac;min-height:16px}.rewards.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.rewards.two .thumb{height:76px}.rewards.four,.rewards.six{display:grid;grid-template-columns:1fr 1fr;gap:9px 17px;align-items:stretch}.rewards.four .reward:nth-child(1){grid-area:1/1}.rewards.four .reward:nth-child(2){grid-area:2/1}.rewards.four .reward:nth-child(3){grid-area:3/1}.rewards.four .reward:nth-child(4){grid-area:1/2/4/3}.rewards.six .reward:nth-child(1){grid-area:1/1}.rewards.six .reward:nth-child(2){grid-area:2/1}.rewards.six .reward:nth-child(3){grid-area:3/1}.rewards.six .reward:nth-child(4){grid-area:4/1}.rewards.six .reward:nth-child(5){grid-area:1/2/4/3}.rewards.six .reward:nth-child(6){grid-area:4/2}.rewards.four .reward:nth-child(4),.rewards.six .reward:nth-child(5){display:flex;flex-direction:column}.rewards.four .reward:nth-child(4) .thumb,.rewards.six .reward:nth-child(5) .thumb{flex:1;height:auto;min-height:180px;background:linear-gradient(145deg,#332819,#0a0908 65%,#211a10)}.footer{background:linear-gradient(180deg,#201a12,#0b0a08 70%);border-top:2px solid #b99a61;box-shadow:0 -3px 15px #000c;padding:12px 11px calc(13px + env(safe-area-inset-bottom));flex-shrink:0}.footrow{display:flex;gap:9px;align-items:center}.avatar{width:47px;height:47px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#57452e,#1b170f);border:2px solid #c9ac74;color:#f1dfb3;font-size:11px}.footmain{flex:1;min-width:0}.foottop{display:flex;justify-content:space-between;align-items:center;gap:5px;font-size:12px;color:#e7d1a0}.foottop span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rechargebtn{background:linear-gradient(180deg,#fff1c7,#dfbd80 45%,#b28a4e 90%);border:1px solid #fff0c0;border-radius:9px;color:#33210d;font-family:Georgia,serif;font-size:13px;box-shadow:inset 0 1px #fff8dd,0 2px 5px #000b;font-weight:bold;padding:9px 12px;cursor:pointer;white-space:nowrap}.progressrow{display:flex;gap:7px;align-items:center;margin:9px 0 5px}.track{height:11px;background:#2d261c;border:1px solid #94764c;border-radius:15px;overflow:hidden;flex:1}.fill{height:100%;background:linear-gradient(90deg,#a87c36,#f5d68d);border-radius:15px;width:0}.next{font-size:12px;white-space:nowrap;color:#ead6a8}.remaining{font-size:11px;color:#ad9971}.sim{background:#16120d;border-top:1px solid #826a46;padding:9px 12px;font-size:12px;color:#dcc696}.sim[hidden]{display:none}.sim button{border:1px solid #94784a;background:#2a2117;color:#f0daaa;border-radius:15px;padding:6px 9px;margin:5px 3px 0 0;cursor:pointer}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:24px;z-index:10}.modal.show{display:flex}.sheet{background:linear-gradient(#f8e8c1,#e1c594);border:3px solid #b39356;color:#352411;max-width:390px;width:100%;border-radius:14px;padding:18px;line-height:1.8;font-size:13px;max-height:80vh;overflow:auto}.sheet h2{text-align:center;margin:0 0 14px;font-size:20px}.sheet button{display:block;margin:15px auto 0;border:1px solid #94723c;background:linear-gradient(#e9d3a0,#b89257);color:#32220e;border-radius:16px;padding:7px 30px;cursor:pointer}@media(min-width:600px){.phone{height:850px;margin:18px auto;box-shadow:0 10px 40px #000;border:2px solid #9f814c;border-radius:12px;overflow:hidden}}
</style></head><body><div class="phone"><div class="scroll"><div class="header"><h1>Recharge Rewards</h1><button class="rule" id="rule">Rule</button></div><div class="tabs"><button class="active" data-tab="daily">Daily<br>Rewards</button><button data-tab="weekly">Weekly<br>Rewards</button><button data-tab="monthly">Monthly<br>Rewards</button></div><div class="countdown"><div class="timeunit"><div class="digits" id="dd">00</div><small>Day</small></div><div class="colon">:</div><div class="timeunit"><div class="digits" id="hh">00</div><small>Hour</small></div><div class="colon">:</div><div class="timeunit"><div class="digits" id="mm">00</div><small>Min</small></div><div class="colon">:</div><div class="timeunit"><div class="digits" id="ss">00</div><small>Sec</small></div></div><div class="hint">Rewards will be issued after the period ends.</div><div id="tiers"></div></div><div class="footer"><div class="footrow"><div class="avatar">头像</div><div class="footmain"><div class="foottop"><span id="total"></span><button class="rechargebtn" id="recharge">Recharge</button></div><div class="progressrow"><div class="track"><div class="fill" id="fill"></div></div><span class="next" id="next"></span></div><div class="remaining" id="remaining"></div></div></div></div><div class="sim" id="sim" hidden>模拟充值（仅用于产品验收）<div><button data-add="100000">+100,000</button><button data-add="500000">+500,000</button><button data-add="2000000">+2,000,000</button><button data-add="reset">重置当前周期</button></div></div></div><div class="modal" id="modal"><div class="sheet"><h2>Activity Rules</h2><p>1. 日、周、月充值奖励分别独立统计。</p><p>2. 每个统计周期仅发放最高达成档位的奖励。</p><p>3. 奖励于统计周期结束后统一发放。</p><p>4. 活动统计时区为 UTC+5。</p><button id="close">关闭</button></div></div><script>
const vip=(i,d)=>({name:'VIP'+(i+1),detail:d+'天',type:'small'});
const frame=d=>({name:'头像框',detail:d+'天',type:'small'});
const money=(n,name='游戏币')=>({name,detail:n.toLocaleString('en-US'),type:'small'});
const ride=(name,d)=>({name,detail:d+'天',type:'large'});
const data={
daily:{label:'Daily',amount:80000,tiers:[20000,40000,200000,500000,1000000,2000000].map((coins,i)=>({coins,rewards:i<3?[vip(i,7),frame(7)]:[vip(i,7),frame(7),money([30000,80000,200000][i-3]),ride(['掘金','龙魂战骑','极光战神'][i-3],7)]}))},
weekly:{label:'Weekly',amount:1800000,tiers:[1000000,2000000,3000000,4000000,6000000,8000000].map((coins,i)=>({coins,rewards:[vip(i,15),frame(15),money([50000,120000,210000,320000,540000,800000][i]),ride(['幻影风神','保时捷','迈凯伦','法拉利','兰博基尼','布加迪'][i],15)]}))},
monthly:{label:'Monthly',amount:3500000,tiers:[5000000,10000000,15000000,20000000,30000000,40000000].map((coins,i)=>({coins,rewards:[vip(i,30),frame(30),{name:'定制靓号',detail:'30天',type:'small'},{name:'徽章',detail:(i===5?3:30)+'天',type:'small'},ride(['苍狼砺行','黑豹逐锋','金豹驰野','猛虎破途','从林雄狮','鹰驰丛林'][i],30),money([100000,250000,450000,700000,1200000,2000000][i],'金币')]}))}};
let current='daily';const $=id=>document.getElementById(id);const fmt=n=>n.toLocaleString('en-US');
function render(){const d=data[current];document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===current));$('tiers').innerHTML=d.tiers.map(t=>'<section class="tier"><div class="tierhead">Recharge <span class="coin"></span> '+fmt(t.coins)+'</div><div class="rewards '+(t.rewards.length===2?'two':t.rewards.length===4?'four':'six')+'">'+t.rewards.map(r=>'<div class="reward"><div class="thumb">'+(r.type==='large'?'座驾图':'缩略图')+'</div><div class="rewardlabel">'+r.name+' × '+r.detail+'</div></div>').join('')+'</div></section>').join('');$('total').textContent=d.label+' Recharge: '+fmt(d.amount);const next=d.tiers.find(t=>t.coins>d.amount);$('next').textContent=next?fmt(next.coins):'Max';$('fill').style.width=(next?Math.min(100,d.amount/next.coins*100):100)+'%';$('remaining').textContent=next?'Progress to next level: '+fmt(next.coins-d.amount):''}
function tick(){const now=Date.now(),local=new Date(now+5*3600000),y=local.getUTCFullYear(),m=local.getUTCMonth(),d=local.getUTCDate(),w=local.getUTCDay();let end;if(current==='daily')end=Date.UTC(y,m,d+1)-5*3600000;else if(current==='weekly')end=Date.UTC(y,m,d+(8-(w||7)))-5*3600000;else end=Date.UTC(y,m+1,1)-5*3600000;let s=Math.max(0,Math.floor((end-now)/1000));[['dd',Math.floor(s/86400)],['hh',Math.floor(s%86400/3600)],['mm',Math.floor(s%3600/60)],['ss',s%60]].forEach(([id,n])=>$(id).textContent=String(n).padStart(2,'0'))}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{current=b.dataset.tab;render();tick()});$('rule').onclick=()=>$('modal').classList.add('show');$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};$('recharge').onclick=()=>{$('sim').hidden=!$('sim').hidden};document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{data[current].amount=b.dataset.add==='reset'?0:data[current].amount+Number(b.dataset.add);render()});render();tick();setInterval(tick,1000);
</script></body></html>
