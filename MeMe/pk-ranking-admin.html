<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PK排位赛后台 - 主播排位数据</title>
<style>
:root {
  --bg: #f0f2f5;
  --card: #fff;
  --border: #e8e8e8;
  --text: #333;
  --text2: #666;
  --text3: #999;
  --primary: #1890ff;
  --danger: #ff4d4f;
  --success: #52c41a;
  --warning: #faad14;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 14px; }

/* 头部 */
.header { background: #001529; color: #fff; height: 48px; display: flex; align-items: center; padding: 0 24px; }
.header h1 { font-size: 16px; font-weight: 500; }
.header .nav { margin-left: 40px; display: flex; gap: 24px; }
.header .nav a { color: rgba(255,255,255,.65); font-size: 14px; cursor: pointer; transition: color .2s; }
.header .nav a:hover, .header .nav a.active { color: #fff; }
.header .season-tag { margin-left: auto; background: rgba(255,255,255,.15); padding: 4px 12px; border-radius: 4px; font-size: 13px; }

/* 内容区 */
.content { padding: 16px 24px; }

/* 搜索栏 */
.search-bar { background: var(--card); border-radius: 4px; padding: 16px 24px; margin-bottom: 16px; display: flex; align-items: center; gap: 16px; border: 1px solid var(--border); }
.search-bar label { color: var(--text2); font-size: 14px; }
.search-bar input, .search-bar select { height: 32px; border: 1px solid var(--border); border-radius: 4px; padding: 4px 12px; font-size: 14px; outline: none; }
.search-bar input:focus, .search-bar select:focus { border-color: var(--primary); }
.search-bar input { width: 200px; }
.search-bar select { width: 240px; }
.btn { height: 32px; padding: 4px 16px; border-radius: 4px; font-size: 14px; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text); }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: #40a9ff; }

/* 段位统计卡片 */
.tier-stat-row { display: flex; gap: 12px; margin-bottom: 16px; }
.tier-stat-card { background: var(--card); border-radius: 6px; padding: 14px 16px; border: 1px solid var(--border); flex: 1; display: flex; flex-direction: column; transition: box-shadow .2s; }
.tier-stat-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.tier-stat-card .tier-name { font-size: 13px; color: var(--text3); }
.tier-stat-card .tier-count { font-size: 20px; font-weight: 600; color: var(--text); }

/* 表格 */
.table-wrap { background: var(--card); border-radius: 4px; border: 1px solid var(--border); overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
thead { background: #fafafa; }
th { padding: 12px 16px; font-weight: 500; color: var(--text2); text-align: left; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
th:hover { color: var(--primary); }
th .sort-icon { font-size: 10px; margin-left: 4px; color: var(--text3); }
th.sorted .sort-icon { color: var(--primary); }
td { padding: 12px 16px; border-bottom: 1px solid var(--border); }
tr:hover { background: #e6f7ff; }

/* 排名 */
.rank { font-weight: 600; width: 50px; text-align: center; }

/* 主播信息 */
.anchor-cell { display: flex; align-items: center; gap: 10px; }
.anchor-avatar { width: 36px; height: 36px; border-radius: 50%; background: #ddd; flex-shrink: 0; overflow: hidden; }
.anchor-avatar img { width: 100%; height: 100%; object-fit: cover; }
.anchor-info { display: flex; flex-direction: column; }
.anchor-name { font-size: 14px; font-weight: 500; color: var(--text); }
.anchor-uid { font-size: 12px; color: var(--text3); }

/* 段位分 */
.score-cell { font-weight: 600; font-size: 14px; }

/* PK结果 */
.pk-result { display: flex; gap: 6px; font-size: 13px; }
.pk-result .win { color: var(--success); }
.pk-result .draw { color: var(--warning); }
.pk-result .lose { color: var(--text3); }
.pk-result .escape { color: var(--danger); }

/* 分页 */
.pagination { padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border); }
.pagination .info { color: var(--text3); font-size: 13px; }
.page-btns { display: flex; gap: 8px; }
.page-btn { width: 32px; height: 32px; border-radius: 4px; border: 1px solid var(--border); background: var(--card); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; }
.page-btn:hover { color: var(--primary); border-color: var(--primary); }
.page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.page-btn.disabled { opacity: .4; cursor: default; }

/* 操作按钮 */
.op-btn { padding: 4px 12px; border-radius: 4px; font-size: 13px; cursor: pointer; border: 1px solid var(--primary); background: var(--primary); color: #fff; transition: all .2s; white-space: nowrap; }
.op-btn:hover { background: #40a9ff; border-color: #40a9ff; }

/* 二级页面 */
.detail-page { display: none; }
.detail-page.show { display: block; }
.list-page.hide { display: none; }

/* 面包屑 */
.breadcrumb { background: var(--card); border-radius: 4px; padding: 12px 24px; margin-bottom: 16px; border: 1px solid var(--border); display: flex; align-items: center; gap: 8px; font-size: 14px; }
.breadcrumb a { color: var(--primary); cursor: pointer; }
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb .sep { color: var(--text3); }
.breadcrumb .current { color: var(--text2); }

/* 详情页头部 */
.detail-header { background: var(--card); border-radius: 4px; padding: 20px 24px; margin-bottom: 16px; border: 1px solid var(--border); }
.detail-header .title-row { display: flex; align-items: center; justify-content: space-between; }
.detail-header .anchor-title { display: flex; align-items: center; gap: 16px; }
.detail-header .anchor-name { font-size: 18px; font-weight: 600; }
.detail-header .anchor-uid { font-size: 14px; color: var(--text3); }
.detail-header .anchor-meta { display: flex; gap: 20px; margin-top: 12px; }
.detail-header .meta-item { font-size: 14px; color: var(--text2); }
.detail-header .meta-item .meta-label { color: var(--text3); }
.detail-header .meta-item .meta-value { color: var(--text); font-weight: 500; }

/* 详情统计卡片 */
.detail-stats { display: flex; gap: 16px; margin-bottom: 16px; }
.detail-stat-card { background: var(--card); border-radius: 4px; padding: 16px 20px; border: 1px solid var(--border); flex: 1; }
.detail-stat-card .label { color: var(--text3); font-size: 13px; margin-bottom: 8px; }
.detail-stat-card .value { font-size: 22px; font-weight: 600; }
.detail-stat-card .value.primary { color: var(--primary); }
.detail-stat-card .value.gold { color: #d48806; }

/* 详情表格 */
.detail-table-wrap { background: var(--card); border-radius: 4px; border: 1px solid var(--border); overflow: hidden; }
.detail-table-wrap .title-bar { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.detail-table-wrap .title-bar h3 { font-size: 16px; font-weight: 500; }
.detail-table-wrap .title-bar .filter-tabs { display: flex; gap: 4px; }
.detail-table-wrap .title-bar .filter-tab { padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; color: var(--text2); }
.detail-table-wrap .title-bar .filter-tab.active { background: var(--primary); color: #fff; }
.detail-table-wrap .title-bar .filter-tab:hover:not(.active) { background: #e6f7ff; color: var(--primary); }
.detail-table-wrap table { width: 100%; border-collapse: collapse; }
.detail-table-wrap thead { background: #fafafa; }
.detail-table-wrap th { padding: 12px 16px; font-weight: 500; color: var(--text2); text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
.detail-table-wrap td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
.detail-table-wrap tr:hover { background: #e6f7ff; }
.detail-table-wrap .change-up { color: var(--success); font-weight: 500; }
.detail-table-wrap .result-win { color: var(--success); }
.detail-table-wrap .result-draw { color: var(--warning); }
.detail-table-wrap .result-lose { color: var(--text3); }
.detail-table-wrap .result-escape { color: var(--danger); }

.detail-table-wrap .first-win-tag { display: inline-block; padding: 1px 6px; border-radius: 3px; background: #fff7e6; color: #d48806; font-size: 11px; margin-left: 4px; }

/* 详情分页 */
.detail-pagination { padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border); }
.detail-pagination .info { color: var(--text3); font-size: 13px; }

/* 响应式 */
@media (max-width: 1200px) {
  .tier-stat-row { flex-wrap: wrap; }
  .tier-stat-card { min-width: 160px; }
}
</style>
</head>
<body>

<!-- 头部 -->
<div class="header">
  <h1>PK排位赛</h1>
  <div class="nav">

  </div>

  <!-- 表格 -->

    <table>
      <thead>
        <tr>
          <th onclick="sortBy('rank')" id="th-rank">排名 <span class="sort-icon">▼</span></th>
          <th>主播</th>

          <th onclick="sortBy('maxPk')" id="th-maxPk">单场最高流水 <span class="sort-icon"></span></th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
    <div class="pagination">
      <div class="info" id="page-info">第 1-20 条，共 117 条</div>
      <div class="page-btns" id="page-btns"></div>
    </div>
  </div>
  </div><!-- /list-page -->

  <!-- 详情页 -->
  <div class="detail-page" id="detail-page">
    <!-- 面包屑 -->
    <div class="breadcrumb">
      <a onclick="backToList()">主播排位数据</a>
      <span class="sep">/</span>
      <span class="current" id="detail-breadcrumb-name">段位分详情</span>
    </div>

    <!-- 详情头部 -->
    <div class="detail-header" id="detail-header"></div>

    <!-- 详情统计卡片 -->
    <div class="detail-stats" id="detail-stats"></div>

    <!-- 详情表格 -->
    <div class="detail-table-wrap">
      <div class="title-bar">
        <h3>段位分明细</h3>
        <div class="filter-tabs">
          <div class="filter-tab active" onclick="filterFlow('all', this)">全部</div>
          <div class="filter-tab" onclick="filterFlow('win', this)">胜</div>
          <div class="filter-tab" onclick="filterFlow('draw', this)">平</div>
          <div class="filter-tab" onclick="filterFlow('lose', this)">负</div>

      <table>

</div>

<script>
// ========== 段位配置 ==========

const TIERS = [
  { name:'青铜I', big:'青铜', small:'I', min:0, color:'bronze' },
  { name:'青铜II', big:'青铜', small:'II', min:500, color:'bronze' },
  { name:'青铜III', big:'青铜', small:'III', min:1500, color:'bronze' },
  { name:'青铜IV', big:'青铜', small:'IV', min:4000, color:'bronze' },
  { name:'白银I', big:'白银', small:'I', min:8000, color:'silver' },
  { name:'白银II', big:'白银', small:'II', min:15000, color:'silver' },
  { name:'白银III', big:'白银', small:'III', min:25000, color:'silver' },
  { name:'白银IV', big:'白银', small:'IV', min:40000, color:'silver' },

  { name:'黄金II', big:'黄金', small:'II', min:90000, color:'gold' },
  { name:'黄金III', big:'黄金', small:'III', min:150000, color:'gold' },
  { name:'黄金IV', big:'黄金', small:'IV', min:250000, color:'gold' },
  { name:'铂金I', big:'铂金', small:'I', min:400000, color:'platinum' },
  { name:'铂金II', big:'铂金', small:'II', min:650000, color:'platinum' },
  { name:'铂金III', big:'铂金', small:'III', min:1000000, color:'platinum' },
  { name:'铂金IV', big:'铂金', small:'IV', min:1600000, color:'platinum' },
  { name:'钻石I', big:'钻石', small:'I', min:2500000, color:'diamond' },
  { name:'钻石II', big:'钻石', small:'II', min:3500000, color:'diamond' },
  { name:'钻石III', big:'钻石', small:'III', min:5000000, color:'diamond' },
  { name:'钻石IV', big:'钻石', small:'IV', min:7000000, color:'diamond' },
  { name:'最强王者', big:'王者', small:'', min:10000000, color:'king' },
];

// 大段位分界线（用于统计人数）
const BIG_TIERS = [
  { name:'青铜（人）', color:'bronze', min:0, nextMin:8000 },
  { name:'白银（人）', color:'silver', min:8000, nextMin:60000 },
  { name:'黄金（人）', color:'gold', min:60000, nextMin:400000 },
  { name:'铂金（人）', color:'platinum', min:400000, nextMin:2500000 },
  { name:'钻石（人）', color:'diamond', min:2500000, nextMin:10000000 },
  { name:'最强王者（人）', color:'king', min:10000000, nextMin:Infinity },
];

function getTier(score) {
  let result = TIERS[0];
  for (let t of TIERS) {
    if (score >= t.min) result = t;
  }
  return result;
}

function getBigTier(score) {
  for (let bt of BIG_TIERS) {
    if (score >= bt.min && score < bt.nextMin) return bt;
  }
  return BIG_TIERS[BIG_TIERS.length - 1];
}

function getBigTierKey(bigName) {
  const map = { '青铜':'bronze', '白银':'silver', '黄金':'gold', '铂金':'platinum', '钻石':'diamond', '王者':'king' };
  return map[bigName] || '';
}

// ========== 赛季配置 ==========

function generateSeasons() {
  const seasons = [];
  for (let s = 7; s >= 1; s--) {
    const startDate = `2026.0${s}.01`;
    const endDay = new Date(2026, s, 0).getDate();
    const endDate = `2026.0${s}.${endDay}`;
    seasons.push({ label: `S${s}`, month: s, dateRange: `(${startDate}-${endDate})` });
  }
  return seasons;
}

const SEASONS = generateSeasons();
const CURRENT_SEASON = 'S7';

function initSeasonFilter() {
  const select = document.getElementById('season-filter');
  select.innerHTML = SEASONS.map(s => 
    `<option value="${s.label}" ${s.label === CURRENT_SEASON ? 'selected' : ''}>${s.label}${s.dateRange}</option>`
  ).join('');
}

function onSeasonChange() {
  const season = document.getElementById('season-filter').value;
  const seasonInfo = SEASONS.find(s => s.label === season);
  const isCurrent = season === CURRENT_SEASON;
  
  document.getElementById('header-season-tag').textContent = 
    `${isCurrent ? '当前赛季' : '历史赛季'}：${season} · ${isCurrent ? '进行中' : '已结算'}`;
  
  regenerateData(seasonInfo);
  renderTierStats();
  filterTable();
}

// ========== 数据生成 ==========

const NAMES = ['笑笑🔥🔥','楠熙🎈🎈','倾欣～','MisBeautie','甜心宝贝','小星星','阿喵','小鹿','大橙子','甜甜圈','花花🌸','小辣椒','萌萌哒','温柔姐','快乐主播','甜蜜蜜','阳光妞','小仙女','美美酱','可爱多','宝藏女孩','小熊猫','闪亮星','酷酷姐','阳光妹','幸福妞','开心果','活力妹','甜甜酱','快乐妞','美妞妞','甜果果','闪亮妹','酷炫妞','活力星','阳光宝','幸福妹','开心宝','活力妞','甜蜜果','美星星','可爱宝','宝藏妞','闪亮宝','酷炫妹','阳光星','幸福宝','开心妞','活力宝','甜蜜星','美妞宝','可爱妞','宝藏宝','闪亮妞','酷炫宝','阳光妞','幸福星','开心宝','活力妞','甜蜜宝','美星宝','可爱星','宝藏妞','闪亮宝','酷炫妞','阳光宝','幸福妞','开心星','活力宝','甜蜜妞','美宝星','可爱宝','宝藏星','闪亮妞','酷炫星','阳光妞','幸福宝','开心妞','活力星','甜蜜宝','美妞星','可爱妞','宝藏妞','闪亮星','酷炫宝','阳光星','幸福妞','开心妞','活力妞','甜蜜妞','美妞妞','可爱宝','宝藏妞','闪亮妞','酷炫妞','阳光妞','幸福妞','开心妞','活力妞','甜蜜妞','美妞妞','可爱妞','宝藏妞','闪亮妞','酷炫妞','阳光妞','幸福妞','开心妞','活力妞','甜蜜妞','美妞妞','可爱妞'];

const TOP_TEMPLATES = [
  { uid:'1120942', name:'笑笑🔥🔥', baseScore:8524501, baseMatches:907, winRate:0.60, totalPkRate:1.33 },
  { uid:'1093362', name:'倾欣～', baseScore:3776359, baseMatches:592, winRate:0.60, totalPkRate:0.85 },

  { uid:'1117267', name:'甜心宝贝', baseScore:1367600, baseMatches:52, winRate:0.60, totalPkRate:3.51 },

  { uid:'1140764', name:'阿喵', baseScore:223650, baseMatches:71, winRate:0.60, totalPkRate:0.42 },
  { uid:'1145890', name:'小鹿', baseScore:150000, baseMatches:100, winRate:0.60, totalPkRate:0.20 },
  { uid:'1119783', name:'甜甜圈', baseScore:139500, baseMatches:93, winRate:0.60, totalPkRate:0.20 },

  { uid:'1174008', name:'MisBeautie', baseScore:87000, baseMatches:58, winRate:0.60, totalPkRate:0.20 },
  { uid:'1190834', name:'小辣椒', baseScore:84000, baseMatches:56, winRate:0.60, totalPkRate:0.20 },
  { uid:'1168800', name:'萌萌哒', baseScore:82441, baseMatches:118, winRate:0.60, totalPkRate:0.09 },
  { uid:'1158537', name:'温柔姐', baseScore:75000, baseMatches:30, winRate:0.60, totalPkRate:0.33 },
  { uid:'1172819', name:'快乐主播', baseScore:69000, baseMatches:46, winRate:0.60, totalPkRate:0.20 },

let anchors = [];

function regenerateData(seasonInfo) {
  anchors = [];
  const month = seasonInfo.month;
  const progressFactor = month === 7 ? 1.0 : 0.6 + Math.random() * 0.3;
  
  TOP_TEMPLATES.forEach(t => {
    const score = Math.floor(t.baseScore * progressFactor * (0.8 + Math.random() * 0.3));
    const matches = Math.floor(t.baseMatches * progressFactor);
    const wins = Math.floor(matches * t.winRate);
    const draws = Math.floor(matches * 0.15);
    const loses = matches - wins - draws - Math.floor(matches * 0.03);
    const escapes = Math.floor(matches * 0.03);
    const totalPk = Math.floor(score * t.totalPkRate);
    const maxPk = Math.floor(score / matches * (2 + Math.random() * 3));

    anchors.push({
      uid: t.uid, name: t.name, score, matches,
      wins, draws, loses: Math.max(0, loses), escapes,
      totalPk, maxPk, maxTier: getTier(score).name, avatarSeed: t.uid
    });
  });
  
  const totalAnchors = month === 7 ? 117 : Math.floor(60 + progressFactor * 40);
  
  for (let i = anchors.length; i < totalAnchors; i++) {
    const uid = String(1080000 + Math.floor(Math.random()*80000));
    const name = NAMES[i] || '主播' + uid.slice(-4);
    let score;
    if (i < 50) score = Math.floor(Math.random() * 40000);
    else if (i < 80) score = Math.floor(Math.random() * 8000);
    else score = Math.floor(Math.random() * 3000);

    const matches = Math.max(1, Math.floor(score / 2000 * 0.75 / (0.5 + Math.random())));
    const winRate = 0.35 + Math.random() * 0.3;
    const wins = Math.floor(matches * winRate);
    const draws = Math.floor(matches * 0.15);
    const loses = matches - wins - draws - Math.floor(matches * 0.03);
    const escapes = Math.floor(matches * 0.03);
    const totalPk = Math.floor(score / 0.75 * (0.8 + Math.random() * 0.4));
    const maxPk = matches > 0 ? Math.floor(score / matches * (2 + Math.random() * 3)) : 0;

    anchors.push({
      uid, name, score, matches,
      wins, draws, loses: Math.max(0, loses), escapes,
      totalPk, maxPk, maxTier: getTier(score).name, avatarSeed: uid
    });
  }
  
  anchors.sort((a,b) => b.score - a.score);
  anchors.forEach((a,i) => a.rank = i+1);
}

// ========== 段位人数统计 ==========

function renderTierStats() {
  const counts = {};
  BIG_TIERS.forEach(bt => counts[bt.name] = 0);
  
  anchors.forEach(a => {
    const bigTier = getBigTier(a.score);
    counts[bigTier.name]++;
  });
  
  const row = document.getElementById('tier-stat-row');
  row.innerHTML = BIG_TIERS.map(bt => `
    <div class="tier-stat-card">
      <div class="tier-name">${bt.name}</div>
      <div class="tier-count">${counts[bt.name]}</div>
    </div>
  `).join('');
}

// ========== 状态变量 ==========

let filteredData = [];
let currentPage = 1;
const pageSize = 20;
let sortField = 'rank';
let sortDir = 1;

// ========== 渲染函数 ==========

function filterTable() {
  const search = document.getElementById('search-input').value.trim().toLowerCase();
  const tierFilter = document.getElementById('tier-filter').value;

  filteredData = anchors.filter(a => {
    const matchSearch = !search || a.uid.includes(search) || a.name.toLowerCase().includes(search);
    const matchTier = !tierFilter || getBigTierKey(getTier(a.score).big) === tierFilter;
    return matchSearch && matchTier;
  });

  filteredData.sort((a,b) => {
    const va = a[sortField], vb = b[sortField];
    if (sortField === 'rank') return sortDir * (va - vb);
    if (typeof va === 'number') return sortDir * (va - vb);
    return sortDir * String(va).localeCompare(String(vb));
  });

  currentPage = 1;
  renderTable();
}

function resetFilter() {
  document.getElementById('search-input').value = '';
  document.getElementById('tier-filter').value = '';
  filterTable();
}

function sortBy(field) {
  if (sortField === field) {
    sortDir *= -1;
  } else {
    sortField = field;
    sortDir = field === 'rank' ? 1 : -1;
  }
  document.querySelectorAll('th').forEach(th => th.classList.remove('sorted'));
  const thId = 'th-' + field;
  const th = document.getElementById(thId);
  if (th) {
    th.classList.add('sorted');
    const icon = th.querySelector('.sort-icon');
    if (icon) icon.textContent = sortDir === 1 ? '▼' : '▲';
  }
  filterTable();
}

function renderTable() {
  const tbody = document.getElementById('table-body');
  const total = filteredData.length;
  const totalPages = Math.ceil(total / pageSize);
  const start = (currentPage - 1) * pageSize;
  const end = Math.min(start + pageSize, total);
  const pageData = filteredData.slice(start, end);

  document.getElementById('page-info').textContent = total > 0 ? `第 ${start+1}-${end} 条，共 ${total} 条` : '无数据';

  tbody.innerHTML = pageData.map(a => {
    const tier = getTier(a.score);
    const maxTierObj = TIERS.find(t => t.name === a.maxTier) || getTier(a.score);
    const isTop3 = a.rank <= 3;
    const avatarUrl = `https://api.dicebear.com/7.x/adventurer/svg?seed=${a.avatarSeed}&size=36`;

    return `<tr>
      <td class="rank">${a.rank}</td>
      <td>
        <div class="anchor-cell">
          <div class="anchor-avatar"><img src="${avatarUrl}" alt="" onerror="this.style.display='none'"></div>
          <div class="anchor-info">
            <span class="anchor-name">${a.name}</span>
            <span class="anchor-uid">UID: ${a.uid}</span>
          </div>
        </div>
      </td>
      <td class="score-cell">${formatNum(a.score)}</td>
      <td>${tier.name}</td>
      <td>${a.matches}</td>
      <td>
        <div class="pk-result">
          <span class="win">${a.wins}胜</span>
          <span class="draw">${a.draws}平</span>
          <span class="lose">${a.loses}负</span>
          <span class="escape">${a.escapes}逃</span>
        </div>
      </td>
      <td>${formatNum(a.totalPk)}</td>
      <td>${formatNum(a.maxPk)}</td>
      <td><button class="op-btn" onclick="goToDetail('${a.uid}')">段位分详情</button></td>
    </tr>`;
  }).join('');

  const pageBtns = document.getElementById('page-btns');
  let btns = '';
  btns += `<div class="page-btn ${currentPage<=1?'disabled':''}" onclick="goPage(${currentPage-1})">‹</div>`;
  for (let p = 1; p <= Math.min(totalPages, 8); p++) {
    btns += `<div class="page-btn ${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</div>`;
  }
  if (totalPages > 8) btns += `<div class="page-btn disabled">...</div>`;
  btns += `<div class="page-btn ${currentPage>=totalPages?'disabled':''}" onclick="goPage(${currentPage+1})">›</div>`;
  pageBtns.innerHTML = btns;
}

function goPage(p) {
  const totalPages = Math.ceil(filteredData.length / pageSize);
  if (p < 1 || p > totalPages) return;
  currentPage = p;
  renderTable();
}

function formatNum(n) {
  return n.toLocaleString();
}

// ========== 二级页面：段位分详情 ==========

let currentDetailAnchor = null;
let currentFlows = [];
let filteredFlows = [];
let detailCurrentPage = 1;
const detailPageSize = 15;

function goToDetail(uid) {
  const anchor = anchors.find(a => a.uid === uid);
  if (!anchor) return;

  currentDetailAnchor = anchor;
  const tier = getTier(anchor.score);

  currentFlows = generateFlows(anchor);
  filteredFlows = [...currentFlows];
  detailCurrentPage = 1;

  document.getElementById('detail-breadcrumb-name').textContent = `${anchor.name} · 段位分详情`;

  const seasonLabel = document.getElementById('season-filter').value;
  const seasonInfo = SEASONS.find(s => s.label === seasonLabel);
  const seasonDisplay = seasonInfo ? `${seasonLabel}${seasonInfo.dateRange}` : seasonLabel;
  document.getElementById('detail-header').innerHTML = `
    <div class="title-row">
      <div class="anchor-title">
        <span class="anchor-name">${anchor.name}</span>
        <span class="anchor-uid">UID: ${anchor.uid}</span>
      </div>
      <button class="btn btn-primary" onclick="backToList()">返回列表</button>
    </div>
    <div class="anchor-meta">
      <span class="meta-item"><span class="meta-label">赛季：</span><span class="meta-value">${seasonDisplay}</span></span>
      <span class="meta-item"><span class="meta-label">排名：</span><span class="meta-value">第${anchor.rank}名</span></span>
      <span class="meta-item"><span class="meta-label">赛季段位：</span><span class="meta-value">${tier.name}</span></span>
    </div>
  `;

  document.getElementById('detail-stats').innerHTML = `
    <div class="detail-stat-card">
      <div class="label">赛季段位分</div>
      <div class="value primary">${formatNum(anchor.score)}</div>
    </div>
    <div class="detail-stat-card">
      <div class="label">总PK场次</div>
      <div class="value">${anchor.matches}</div>
    </div>
    <div class="detail-stat-card">
      <div class="label">胜率</div>
      <div class="value">${(anchor.wins/anchor.matches*100).toFixed(1)}%</div>
    </div>
    <div class="detail-stat-card">
      <div class="label">总PK值</div>
      <div class="value gold">${formatNum(anchor.totalPk)}</div>
    </div>
    <div class="detail-stat-card">
      <div class="label">单场最高流水</div>
      <div class="value">${formatNum(anchor.maxPk)}</div>
    </div>
  `;

  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.filter-tab').classList.add('active');

  renderDetailTable();

  document.getElementById('list-page').classList.add('hide');
  document.getElementById('detail-page').classList.add('show');
  window.scrollTo(0, 0);
}

function backToList() {
  document.getElementById('detail-page').classList.remove('show');
  document.getElementById('list-page').classList.remove('hide');
}

function generateFlows(anchor) {
  const flows = [];
  let curScore = 0;
  const results = ['胜','胜','胜','平','平','负','负','胜','胜','平','负','胜'];
  const pkTypes = ['1V1PK','多人PK'];
  const coefficients = { '胜':1.0, '平':0.8, '负':0.5, '逃':0 };
  let matchId = 29000 + Math.floor(Math.random()*1000);

  const flowCount = Math.min(anchor.matches, 50);
  let firstWinUsed = false;
  const season = document.getElementById('season-filter').value;
  const seasonMonth = SEASONS.find(s => s.label === season)?.month || 7;

  for (let i = 0; i < flowCount; i++) {
    const resultIdx = i % results.length;
    const result = results[resultIdx];
    const pkValue = anchor.score > 100000 ? Math.floor(anchor.score / anchor.matches * (0.5 + Math.random())) : Math.floor(2000 + Math.random()*8000);
    const coeff = coefficients[result] || 0;
    
    const isFirstWin = !firstWinUsed && result === '胜' && i < 5;
    const actualCoeff = isFirstWin ? 2.0 : coeff;
    const delta = Math.floor(pkValue * actualCoeff);
    firstWinUsed = firstWinUsed || isFirstWin;

    const prevScore = curScore;
    curScore += delta;
    const prevTier = getTier(prevScore);
    const newTier = getTier(curScore);
    const isUpgrade = newTier.min > prevTier.min;

    const day = Math.min(28, Math.floor(Math.random()*28)+1);
    const hour = Math.floor(Math.random()*24);
    const min = Math.floor(Math.random()*60);

    flows.push({
      matchId: matchId + i,
      pkValue, result, coefficient: actualCoeff, isFirstWin,
      delta, prevScore, newScore: curScore,
      prevTier: prevTier.name, newTier: newTier.name, isUpgrade,
      pkType: pkTypes[Math.floor(Math.random()*2)],
      time: `2026-0${seasonMonth}-${day} ${String(hour).padStart(2,'0')}:${String(min).padStart(2,'0')}`
    });
  }
  return flows;
}

function filterFlow(type, el) {
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');

  if (type === 'all') {
    filteredFlows = [...currentFlows];
  } else if (type === 'win') {
    filteredFlows = currentFlows.filter(f => f.result === '胜');
  } else if (type === 'draw') {
    filteredFlows = currentFlows.filter(f => f.result === '平');
  } else if (type === 'lose') {
    filteredFlows = currentFlows.filter(f => f.result === '负');
  } else if (type === 'upgrade') {
    filteredFlows = currentFlows.filter(f => f.isUpgrade);
  }
  detailCurrentPage = 1;
  renderDetailTable();
}

function renderDetailTable() {
  const tbody = document.getElementById('detail-table-body');
  const total = filteredFlows.length;
  const totalPages = Math.ceil(total / detailPageSize);
  const start = (detailCurrentPage - 1) * detailPageSize;
  const end = Math.min(start + detailPageSize, total);
  const pageData = filteredFlows.slice(start, end);

  document.getElementById('detail-page-info').textContent = total > 0 ? `第 ${start+1}-${end} 条，共 ${total} 条` : '无数据';

  tbody.innerHTML = pageData.map(f => {
    const resultClass = f.result === '胜' ? 'result-win' : f.result === '平' ? 'result-draw' : f.result === '负' ? 'result-lose' : 'result-escape';
    return `<tr>
      <td>${f.matchId}</td>
      <td>${f.time}</td>
      <td>${f.pkType}</td>
      <td>${formatNum(f.pkValue)}</td>
      <td class="${resultClass}">${f.result}</td>
      <td>${f.coefficient}${f.isFirstWin ? '<span class="first-win-tag">首胜</span>' : ''}</td>
      <td class="change-up">+${formatNum(f.delta)}</td>
      <td>${formatNum(f.prevScore)}</td>
      <td>${formatNum(f.newScore)}</td>
      <td>${f.isUpgrade ? f.newTier : f.prevTier}</td>
    </tr>`;
  }).join('');

  const pageBtns = document.getElementById('detail-page-btns');
  let btns = '';
  btns += `<div class="page-btn ${detailCurrentPage<=1?'disabled':''}" onclick="goDetailPage(${detailCurrentPage-1})">‹</div>`;
  for (let p = 1; p <= Math.min(totalPages, 8); p++) {
    btns += `<div class="page-btn ${p===detailCurrentPage?'active':''}" onclick="goDetailPage(${p})">${p}</div>`;
  }
  if (totalPages > 8) btns += `<div class="page-btn disabled">...</div>`;
  btns += `<div class="page-btn ${detailCurrentPage>=totalPages?'disabled':''}" onclick="goDetailPage(${detailCurrentPage+1})">›</div>`;
  pageBtns.innerHTML = btns;
}

function goDetailPage(p) {
  const totalPages = Math.ceil(filteredFlows.length / detailPageSize);
  if (p < 1 || p > totalPages) return;
  detailCurrentPage = p;
  renderDetailTable();
}

// ========== 初始化 ==========

initSeasonFilter();
regenerateData(SEASONS.find(s => s.label === CURRENT_SEASON));
renderTierStats();
filterTable();
</script>
