<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>主播月度激励 - 财务结算</title>
<style>
  :root{--bg:#f5f7fb;--panel:#fff;--line:#e7eaf0;--text:#1d2433;--muted:#7b8494;--blue:#326cff;--blue-bg:#edf3ff;--green:#20845a;--green-bg:#eaf7f0;--orange:#bd6d10;--orange-bg:#fff4e6;--gray:#6f7785;--gray-bg:#f1f3f6;--red:#c44343;--red-bg:#fff0f0}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif} button,input,select{font:inherit} button{cursor:pointer}
  .layout{min-height:100vh}.main{min-width:0}.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;padding:0 28px}.operator{display:flex;align-items:center;gap:10px;color:#586477}.avatar{width:30px;height:30px;border-radius:50%;background:#dce8ff;color:#3164d6;display:grid;place-items:center;font-weight:700}.content{padding:26px 28px 40px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px}.filter{padding:20px;margin-bottom:18px}.form-grid{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr)) auto;gap:16px;align-items:end}.field{display:flex;align-items:center;gap:8px}.field label{flex:none;font-size:13px;color:#4a5566;white-space:nowrap}.field input,.field select{width:100%;height:36px;border:1px solid #dbe0e8;border-radius:6px;padding:0 10px;outline:none;background:#fff;color:#30394a}.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 2px #eaf0ff}.actions{display:flex;gap:10px;white-space:nowrap}.btn{height:36px;border:1px solid #d9dfe8;border-radius:6px;background:#fff;color:#404a5c;padding:0 16px}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn:hover{filter:brightness(.98)}
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.metric{padding:15px 18px}.metric .label{font-size:13px;color:var(--muted)}.metric .value{font-size:24px;font-weight:650;margin-top:5px}.metric .money{color:#326cff}.metric .success{color:#20845a}
  .table-card{overflow:hidden}.table-toolbar{min-height:58px;display:flex;align-items:center;justify-content:flex-start;padding:11px 20px;border-bottom:1px solid var(--line)}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1330px}th{background:#fafbfc;color:#657084;font-size:12px;font-weight:500;text-align:left;height:44px;padding:0 16px;white-space:nowrap}th.check-col,td.check-col{width:44px;padding:0 0 0 20px}input[type="checkbox"]{width:16px;height:16px;accent-color:var(--blue);cursor:pointer;vertical-align:middle}input[type="checkbox"]:disabled{cursor:not-allowed;opacity:.42}td{padding:13px 16px;border-top:1px solid #edf0f4;vertical-align:middle;color:#30394a}.person{display:flex;align-items:center;gap:9px}.pic{width:32px;height:32px;border-radius:50%;background:#dde8fc;color:#3e63ac;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}.pname{font-weight:600}.sub{font-size:12px;color:var(--muted);margin-top:2px}.task-progress{min-width:72px}.progress-value{font-size:14px;font-weight:600;color:#253247;white-space:nowrap}.progress-value .split{color:#a1a9b6;padding:0 2px}.task-result{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-size:12px;color:#8b94a2}.task-result:before{content:"";width:6px;height:6px;border-radius:50%;background:#c5cad3}.task-result.ok{color:#20845a}.task-result.ok:before{background:#2aa375}.tag{display:inline-flex;padding:4px 8px;border-radius:4px;font-size:12px;white-space:nowrap}.tag.no{color:var(--gray);background:var(--gray-bg)}.tag.wait{color:var(--orange);background:var(--orange-bg)}.tag.done{color:var(--green);background:var(--green-bg)}.amount{font-weight:650;color:#26344f}.amount.zero{color:#9ba3b1}.link-btn{border:0;background:transparent;color:#326cff;padding:3px 6px;margin-left:-6px;white-space:nowrap}.pagination{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;color:var(--muted);font-size:13px}.pages{display:flex;gap:5px}.page{width:30px;height:28px;border:1px solid #dce1e8;background:#fff;border-radius:5px;color:#596477}.page.current{color:#fff;border-color:var(--blue);background:var(--blue)}
  .modal-mask{display:none;position:fixed;inset:0;background:rgba(24,35,52,.38);align-items:center;justify-content:center;padding:20px;z-index:2}.modal-mask.show{display:flex}.modal{width:480px;background:#fff;border-radius:10px;overflow:hidden}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0;font-size:16px}.close{border:0;background:transparent;font-size:22px;color:#7d8797;line-height:1}.modal-body{padding:20px}.info-box{border-radius:7px;background:#f7f9fc;padding:12px 14px;margin-bottom:16px}.info-row{display:flex;justify-content:space-between;margin:5px 0}.info-row span{color:var(--muted)}.modal-form{display:grid;gap:14px}.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
  .toast{display:none;position:fixed;right:28px;top:78px;padding:11px 16px;background:#243147;color:#fff;border-radius:7px;z-index:3;font-size:13px}.toast.show{display:block}
  @media(max-width:1100px){.form-grid{grid-template-columns:repeat(2,minmax(160px,1fr))}.actions{grid-column:span 2}}@media(max-width:900px){.content{padding:20px 14px}.topbar{padding:0 14px}.form-grid{grid-template-columns:1fr}.actions{grid-column:span 1}.summary{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="layout">
  <main class="main">
    <header class="topbar"><div class="operator"><div class="avatar">管</div>运营管理员</div></header>
    <div class="content">
      <section class="summary"><div class="card metric"><div class="label">本期主播审核通过数</div><div class="value" id="countAll">6</div></div><div class="card metric"><div class="label">待结算人数</div><div class="value" id="countWait">3</div></div><div class="card metric"><div class="label">待结算金额</div><div class="value money" id="waitMoney">$72.00</div></div><div class="card metric"><div class="label">已结算金额</div><div class="value success" id="doneMoney">$30.00</div></div></section>
      <section class="card filter"><div class="form-grid"><div class="field"><label>主播</label><input id="anchorId" placeholder="请输入主播ID或昵称" /></div><div class="field"><label>代理</label><input id="agentId" placeholder="请输入代理ID或昵称" /></div><div class="field"><label>结算日期</label><select id="period"><option value="2026-01">第 1 期（2026.01.01 - 2026.01.31）</option><option value="2025-12">第 12 期（2025.12.01 - 2025.12.31）</option><option value="2025-11">第 11 期（2025.11.01 - 2025.11.30）</option></select></div><div class="field"><label>结算状态</label><select id="status"><option value="all">全部</option><option value="不结算">不结算</option><option value="待结算">待结算</option><option value="已结算">已结算</option></select></div><div class="actions"><button class="btn primary" onclick="applyFilter()">搜索</button><button class="btn" onclick="resetFilter()">重置</button><button class="btn" onclick="exportData()">导出</button></div></div></section>
      <section class="card table-card"><div class="table-toolbar"><button class="btn primary" id="batchSettleBtn" onclick="batchSettlement()">批量更新为已结算</button></div><div class="table-wrap"><table><thead><tr><th class="check-col"><input type="checkbox" id="selectAll" aria-label="全选待结算记录" onchange="toggleAll(this.checked)" /></th><th>结算日期</th><th>主播信息</th><th>所属代理</th><th>时长任务</th><th>邀新任务</th><th>宣传任务</th><th>应结算金额（USD）</th><th>结算状态</th><th>操作</th></tr></thead><tbody id="tableBody"></tbody></table></div><div class="pagination"><span id="pageInfo">显示 1-6 条，共 6 条</span><div class="pages"><button class="page current">1</button></div></div></section>
    </div>
  </main>
</div>
<div class="modal-mask" id="modalMask"><div class="modal"><div class="modal-head"><h3 id="modalTitle">确认更新为已结算</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="info-box"><div class="info-row"><span>主播</span><b id="modalAnchor">-</b></div><div class="info-row"><span>应结算金额</span><b id="modalAmount">-</b></div><div class="info-row"><span>结算周期</span><b>第 1 期（2026.01）</b></div></div><div class="modal-form"><div class="field"><label>收款账号</label><input id="payAccount" placeholder="请输入代理收款账号" /></div><div class="field"><label>收款信息备注</label><input id="payNote" placeholder="如：代理名称、账户姓名等" /></div></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="confirmBtn" onclick="confirmSettlement()">确认已结算</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const data=[
 {id:'10032658',name:'小鹿',agentId:'8001345',agent:'星耀公会',t1:true,t2:true,t3:true,durationDays:23,inviteCount:6,promoCount:4,amount:30,status:'待结算',period:'2026-01',initial:'鹿'},
 {id:'10049821',name:'夏夏',agentId:'8001345',agent:'星耀公会',t1:true,t2:true,t3:false,durationDays:21,inviteCount:5,promoCount:3,amount:21,status:'待结算',period:'2026-01',initial:'夏'},
 {id:'10076542',name:'阿泽',agentId:'8002098',agent:'云起传媒',t1:true,t2:false,t3:true,durationDays:20,inviteCount:3,promoCount:5,amount:21,status:'待结算',period:'2026-01',initial:'泽'},
 {id:'10088416',name:'甜心',agentId:'8002098',agent:'云起传媒',t1:false,t2:true,t3:true,durationDays:18,inviteCount:7,promoCount:4,amount:0,status:'不结算',period:'2026-01',initial:'甜'},
 {id:'10102368',name:'Kiki',agentId:'8003176',agent:'光年互娱',t1:false,t2:false,t3:true,durationDays:16,inviteCount:4,promoCount:4,amount:0,status:'不结算',period:'2026-01',initial:'K'},
 {id:'10118729',name:'南风',agentId:'8003176',agent:'光年互娱',t1:true,t2:true,t3:true,durationDays:25,inviteCount:8,promoCount:6,amount:30,status:'已结算',period:'2026-01',initial:'南'}
];
let view=[...data], current=null, selectedIds=new Set();
function taskProgress(current,target,unit,ok){return `<div class="task-progress"><div class="progress-value">${current}<span class="split">/</span>${target}</div><span class="task-result ${ok?'ok':''}">${ok?'达标':'未达标'}</span></div>`}
function statusTag(s){let c=s==='已结算'?'done':s==='待结算'?'wait':'no';return `<span class="tag ${c}">${s}</span>`}
function render(){selectedIds=new Set([...selectedIds].filter(id=>view.some(r=>r.id===id&&r.status==='待结算')));const body=document.getElementById('tableBody');body.innerHTML=view.map((r,i)=>`<tr><td class="check-col"><input type="checkbox" aria-label="选择${r.name}" ${r.status==='待结算'?'':'disabled'} ${selectedIds.has(r.id)?'checked':''} onchange="toggleSelect('${r.id}',this.checked)" /></td><td>第 1 期<br><span class="sub">2026.01.01 - 01.31</span></td><td><div class="person"><div class="pic">${r.initial}</div><div><div class="pname">${r.name}</div><div class="sub">UID：${r.id}</div></div></div></td><td><div class="pname">${r.agent}</div><div class="sub">UID：${r.agentId}</div></td><td>${taskProgress(r.durationDays,20,' 天',r.t1)}</td><td>${taskProgress(r.inviteCount,5,' 人',r.t2)}</td><td>${taskProgress(r.promoCount,4,' 张',r.t3)}</td><td><span class="amount ${r.amount===0?'zero':''}">$${r.amount}</span></td><td>${statusTag(r.status)}</td><td>${r.status==='待结算'?`<button class="link-btn" onclick="openSettlement('${r.id}')">更新为已结算</button><br><button class="link-btn" onclick="openReceipt('${r.id}')">收款信息</button>`:`<button class="link-btn" onclick="openReceipt('${r.id}')">收款信息</button>`}</td></tr>`).join('');
 document.getElementById('pageInfo').textContent=`显示 ${view.length?1:0}-${view.length} 条，共 ${view.length} 条`;document.getElementById('countAll').textContent=data.length;const wait=data.filter(x=>x.status==='待结算');document.getElementById('countWait').textContent=wait.length;document.getElementById('waitMoney').textContent='$'+wait.reduce((a,b)=>a+b.amount,0).toFixed(2);document.getElementById('doneMoney').textContent='$'+data.filter(x=>x.status==='已结算').reduce((a,b)=>a+b.amount,0).toFixed(2);updateSelectionUI()}
function updateSelectionUI(){const selectable=view.filter(r=>r.status==='待结算');const all=document.getElementById('selectAll');all.checked=selectable.length>0&&selectable.every(r=>selectedIds.has(r.id));all.indeterminate=selectedIds.size>0&&!all.checked;document.getElementById('batchSettleBtn').disabled=selectedIds.size===0}
function toggleSelect(id,checked){checked?selectedIds.add(id):selectedIds.delete(id);updateSelectionUI()}
function toggleAll(checked){view.filter(r=>r.status==='待结算').forEach(r=>checked?selectedIds.add(r.id):selectedIds.delete(r.id));render()}
function batchSettlement(){if(!selectedIds.size){showToast('请先选择待结算记录');return}const ids=[...selectedIds];data.forEach(r=>{if(ids.includes(r.id)&&r.status==='待结算'){r.status='已结算';r.payAccount=r.payAccount||'代理账号：AGENT-'+r.agentId;r.payNote=r.payNote||r.agent+' 批量线下结算'}});selectedIds.clear();applyFilter();showToast(`已批量更新 ${ids.length} 条记录为已结算`)}
function applyFilter(){const a=document.getElementById('anchorId').value.trim(),g=document.getElementById('agentId').value.trim(),s=document.getElementById('status').value,p=document.getElementById('period').value;view=data.filter(r=>(!a||r.id.includes(a)||r.name.toLowerCase().includes(a.toLowerCase()))&&(!g||r.agentId.includes(g)||r.agent.toLowerCase().includes(g.toLowerCase()))&&(s==='all'||r.status===s)&&r.period===p);render()}
function resetFilter(){document.getElementById('anchorId').value='';document.getElementById('agentId').value='';document.getElementById('status').value='all';document.getElementById('period').value='2026-01';view=[...data];selectedIds.clear();render()}
function openSettlement(id){current=data.find(x=>x.id===id);document.getElementById('modalTitle').textContent='确认更新为已结算';document.getElementById('confirmBtn').style.display='inline-block';fillModal();document.getElementById('modalMask').classList.add('show')}
function openReceipt(id){current=data.find(x=>x.id===id);document.getElementById('modalTitle').textContent='收款信息';document.getElementById('confirmBtn').style.display='none';fillModal();document.getElementById('payAccount').value=current.payAccount||'代理账号：AGENT-'+current.agentId;document.getElementById('payNote').value=current.payNote||current.agent+' 线下收款账户';document.getElementById('modalMask').classList.add('show')}
function fillModal(){document.getElementById('modalAnchor').textContent=current.name+'（'+current.id+'）';document.getElementById('modalAmount').textContent='$'+current.amount;document.getElementById('payAccount').value='';document.getElementById('payNote').value=''}
function closeModal(){document.getElementById('modalMask').classList.remove('show');current=null}
function confirmSettlement(){if(!document.getElementById('payAccount').value.trim()){showToast('请填写收款账号后再确认');return}current.status='已结算';selectedIds.delete(current.id);current.payAccount=document.getElementById('payAccount').value.trim();current.payNote=document.getElementById('payNote').value.trim();closeModal();applyFilter();showToast('已更新为已结算，并保存收款信息')}
function exportData(){const cols=['结算日期','主播UID','主播昵称','代理UID','代理昵称','时长任务主播进度','时长任务目标进度','时长任务结果','邀新任务主播进度','邀新任务目标进度','邀新任务结果','宣传任务主播进度','宣传任务目标进度','宣传任务结果','应结算金额USD','结算状态'];const rows=view.map(r=>['第1期（2026.01.01-2026.01.31）',r.id,r.name,r.agentId,r.agent,r.durationDays+'天','20天',r.t1?'达标':'未达标',r.inviteCount+'人','5人',r.t2?'达标':'未达标',r.promoCount+'张','4张',r.t3?'达标':'未达标',r.amount,r.status]);const csv='\ufeff'+[cols,...rows].map(x=>x.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));link.download='主播月度激励结算_2026-01.csv';link.click();URL.revokeObjectURL(link.href);showToast('已导出当前筛选结果')}
function showToast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}render();
</script>
</body>
</html>
